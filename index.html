<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIR4 NFT Detail</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Colores del diseño original */
    --bg-main: #07090e;
    --bg-card: #0d111a;
    --bg-card-hover: #131b2e;
    --border: #1e293b;
    --accent-cyan: #06b6d4;
    --text-main: #f8fafc;
    --text-muted: #8892a6;
    
    /* Colores oficiales de rareza MIR4 */
    --rarity-legendary: #f59e0b; /* Dorado */
    --rarity-epic: #ef4444;      /* Rojo */
    --rarity-rare: #3b82f6;      /* Azul */
    --rarity-uncommon: #10b981;  /* Verde */
    --rarity-common: #9ca3af;    /* Gris */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-main);
    color: var(--text-main);
    font-family: 'Outfit', system-ui, sans-serif;
    padding: 18px;
  }

  .wrap { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  /* Barra superior */
  .top-bar {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 18px; font-weight: 700; color: var(--text-main); }
  .btn-back { color: var(--accent-cyan); text-decoration: none; font-weight: 700; font-size: 14px; }
  .btn-back:hover { text-decoration: underline; }

  /* Hero Card */
  .hero-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    display: grid;
    grid-template-columns: 200px 1fr 250px;
    gap: 24px;
    align-items: center;
  }
  .hero-img-box {
    position: relative;
    width: 200px;
    height: 200px;
    background: #111827;
    border: 2px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-img-box img { width: 100%; height: 100%; object-fit: contain; }
  
  .hero-info { display: flex; flex-direction: column; gap: 8px; }
  .hero-title { font-size: 28px; font-weight: 800; color: var(--text-main); }
  
  .hero-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 10px;
  }
  .stat-box { background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 10px; border-radius: 8px; }
  .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
  .stat-value { font-size: 16px; font-weight: 800; color: var(--text-main); }

  .hero-actions { display: flex; flex-direction: column; gap: 14px; padding-left: 20px; border-left: 1px solid var(--border); }
  .price-wemix { font-size: 24px; font-weight: 800; }
  .price-wemix span { font-size: 14px; color: var(--text-muted); }
  
  .btn {
    background: transparent;
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: all 0.15s ease;
  }
  .btn:hover { background: rgba(6, 182, 212, 0.1); }

  /* Pestañas de inventario */
  .status-tabs { display: flex; gap: 6px; margin: 10px 0; }
  .status-tabs button {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .status-tabs button.active {
    background: rgba(6, 182, 212, 0.12);
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }

  /* Grid de inventario */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s ease;
  }
  .card:hover { transform: translateY(-3px); }
  
  .card-img {
    position: relative;
    width: 100%;
    height: 120px;
    background: #111827;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid var(--border);
  }
  .card-img img { width: 70%; height: 70%; object-fit: contain; }

  /* Etiquetas de Rareza */
  .tag-rarity {
    position: absolute;
    top: 8px;
    left: 8px;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    background: rgba(0,0,0,0.8);
    border: 1px solid var(--border);
  }
  .tag-trade {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
  }
  .tag-trade.is-tradeable { background: rgba(6,182,212,0.85); color: #fff; }
  .tag-trade.is-bound { background: rgba(136,146,166,0.3); color: var(--text-main); }

  .card-body { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
  .card-title { font-size: 13px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-stats { font-size: 11px; color: var(--text-muted); }

  /* Clases dinámicas de colores */
  .border-legendary { border-color: var(--rarity-legendary) !important; box-shadow: 0 0 10px rgba(245, 158, 11, 0.15); }
  .border-epic { border-color: var(--rarity-epic) !important; box-shadow: 0 0 10px rgba(239, 68, 68, 0.15); }
  .border-rare { border-color: var(--rarity-rare) !important; }
  .border-uncommon { border-color: var(--rarity-uncommon) !important; }
  .border-common { border-color: var(--rarity-common) !important; }
  
  .text-legendary { color: var(--rarity-legendary) !important; }
  .text-epic { color: var(--rarity-epic) !important; }
  .text-rare { color: var(--rarity-rare) !important; }
  .text-uncommon { color: var(--rarity-uncommon) !important; }
  .text-common { color: var(--rarity-common) !important; }

  .empty-state { text-align: center; padding: 60px; color: var(--text-muted); font-size: 14px; grid-column: 1 / -1; }

  @media (max-width: 768px) {
    .hero-card { grid-template-columns: 1fr; text-align: center; }
    .hero-img-box { margin: 0 auto; }
    .hero-actions { border-left: none; border-top: 1px solid var(--border); padding-left: 0; padding-top: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <a href="index.html" class="btn-back">← Volver al Mercado</a>
    <div class="brand">
      <h1>Detalle del Personaje</h1>
    </div>
  </div>

  <div id="hero-container">
    <div class="empty-state">Cargando información del personaje...</div>
  </div>

  <div class="status-tabs" id="inventory-filters" style="display: none;">
    <!-- OJO AQUI: Se cambió la forma de llamar a la función (agregando 'this') -->
    <button class="active" onclick="filtrar('all', this)">Todos los ítems</button>
    <button onclick="filtrar('tradeable', this)">Tradeables</button>
    <button onclick="filtrar('bound', this)">Bindeados</button>
  </div>

  <div class="grid" id="inventory-grid">
    <!-- Ítems se cargan aquí -->
  </div>
</div>

<script>
const URL_API = "https://mir4-backend.onrender.com/api/nfts";
let itemsInventario = [];

// Determinar rareza de forma segura
function getRarityInfo(gradeOrClass) {
  const val = String(gradeOrClass || '').toLowerCase();
  if (val.includes('5') || val.includes('legendary') || val.includes('legendario')) return { class: 'legendary', label: 'Legendary' };
  if (val.includes('4') || val.includes('epic') || val.includes('epico')) return { class: 'epic', label: 'Epic' };
  if (val.includes('3') || val.includes('rare') || val.includes('raro')) return { class: 'rare', label: 'Rare' };
  if (val.includes('2') || val.includes('uncommon')) return { class: 'uncommon', label: 'Uncommon' };
  return { class: 'common', label: 'Common' };
}

async function cargarDetalle() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if (!id) {
    document.getElementById('hero-container').innerHTML = `<div class="empty-state" style="color:var(--accent-red)">ID no proporcionado en la URL.</div>`;
    return;
  }

  try {
    const res = await fetch(URL_API);
    if (!res.ok) throw new Error("Fallo la conexión con el servidor");
    
    const data = await res.json();
    
    // Validación de seguridad por si data.items viene nulo
    const listaItems = Array.isArray(data.items) ? data.items : [];
    const nft = listaItems.find(n => String(n.id) === String(id));

    if (!nft) throw new Error("Personaje no encontrado en la base de datos.");
    
    renderizarHero(nft);
    
    // Preparar inventario
    const equip = Array.isArray(nft.equipment) ? nft.equipment : [];
    const tradeables = Array.isArray(nft.tradeable_equipment) ? nft.tradeable_equipment.map(i => ({...i, isTradeable: true})) : [];
    const normales = equip.map(i => ({...i, isTradeable: false}));
    
    itemsInventario = [...tradeables, ...normales];
    
    document.getElementById('inventory-filters').style.display = 'flex';
    renderizarInventario(itemsInventario);

  } catch (err) {
    console.error(err);
    document.getElementById('hero-container').innerHTML = `<div class="empty-state" style="color:var(--accent-red)">Error: ${err.message}</div>`;
  }
}

function renderizarHero(nft) {
  const rarity = getRarityInfo(nft.class); 
  
  const heroHtml = `
    <div class="hero-card">
      <div class="hero-img-box border-${rarity.class}">
        <img src="${nft.image || 'https://www.xdraco.com/nft/assets/img/common/thumb-default.png'}" alt="Avatar">
        <div class="tag-rarity border-${rarity.class} text-${rarity.class}">${nft.class || 'N/A'}</div>
      </div>
      
      <div class="hero-info">
        <div class="stat-label">MIR4 NFT</div>
        <h2 class="hero-title">${nft.name || 'Sin nombre'}</h2>
        
        <div class="hero-stats">
          <div class="stat-box">
            <div class="stat-label">Nivel</div>
            <div class="stat-value">${nft.level || 'N/A'}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Poder (PS)</div>
            <div class="stat-value text-epic">${nft.power ? Number(nft.power).toLocaleString('en-US') : 'N/A'}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Servidor</div>
            <div class="stat-value">${nft.server || 'N/A'}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Clase Base</div>
            <div class="stat-value text-${rarity.class}">${nft.class || 'N/A'}</div>
          </div>
        </div>
      </div>
      
      <div class="hero-actions">
        <div>
          <div class="stat-label">Precio</div>
          <div class="price-wemix text-legendary">${nft.price_wemix ? Number(nft.price_wemix).toLocaleString('en-US') : 'Consultar'} <span>WEMIX</span></div>
        </div>
        <a href="${nft.url || '#'}" target="_blank" class="btn" style="background: var(--accent-cyan); color: #000; border-color: var(--accent-cyan);">Ver en WEMIX PLAY</a>
        <button class="btn" onclick="copiarID('${nft.id || ''}')">Copiar ID</button>
      </div>
    </div>
  `;
  document.getElementById('hero-container').innerHTML = heroHtml;
}

function renderizarInventario(items) {
  const grid = document.getElementById('inventory-grid');
  
  if (items.length === 0) {
    grid.innerHTML = `<div class="empty-state">No hay ítems registrados en el inventario.</div>`;
    return;
  }

  grid.innerHTML = items.map(item => {
    const rarity = getRarityInfo(item.grade || item.tier || 1); 
    const isTrade = item.isTradeable;

    return `
      <div class="card border-${rarity.class}">
        <div class="card-img">
          <img src="${item.icon || ''}" alt="${item.name || 'Item'}" onerror="this.style.display='none'">
          <div class="tag-rarity border-${rarity.class} text-${rarity.class}">${rarity.label}</div>
          <div class="tag-trade ${isTrade ? 'is-tradeable' : 'is-bound'}">${isTrade ? 'TRADEABLE' : 'BOUND'}</div>
        </div>
        <div class="card-body">
          <div class="card-title">${item.name || 'Ítem desconocido'}</div>
          <div class="card-stats">Enhance: +${item.enhance || '0'} | Equipamiento</div>
        </div>
      </div>
    `;
  }).join('');
}

// CORRECCIÓN APLICADA AQUÍ: Recibe el botón que disparó el evento
function filtrar(tipo, btnElement) {
  // Quitar la clase 'active' de todos los botones
  document.querySelectorAll('.status-tabs button').forEach(b => b.classList.remove('active'));
  // Añadir la clase 'active' al botón clickeado
  btnElement.classList.add('active');

  if (tipo === 'all') renderizarInventario(itemsInventario);
  else if (tipo === 'tradeable') renderizarInventario(itemsInventario.filter(i => i.isTradeable));
  else if (tipo === 'bound') renderizarInventario(itemsInventario.filter(i => !i.isTradeable));
}

function copiarID(idStr) {
  navigator.clipboard.writeText(idStr).then(() => {
    alert("ID copiado al portapapeles: " + idStr);
  });
}

document.addEventListener('DOMContentLoaded', cargarDetalle);
</script>
</body>
</html>
