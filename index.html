<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIR4 NFT Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #07090e;
    --bg-card: #0d111a;
    --border: #1e293b;
    --accent-gold: #f59e0b;
    --accent-cyan: #06b6d4;
    --accent-red: #ef4444;
    --text-main: #f8fafc;
    --text-muted: #8892a6;

    --g1: #9ca3af;
    --g2: #22c55e;
    --g3: #3b82f6;
    --g4: #a855f7;
    --g5: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-main);
    color: var(--text-main);
    font-family: 'Outfit', system-ui, sans-serif;
    padding: 18px;
  }

  .wrap { max-width: 1200px; margin: 0 auto; }

  .top-bar {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 14px;
  }
  .brand h1 { font-size: 18px; font-weight: 700; }
  .brand span { font-size: 12px; color: var(--text-muted); }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 10px;
  }
  .search-box {
    flex: 1 1 220px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .search-box input {
    background: transparent; border: none; outline: none;
    color: var(--text-main); font-family: inherit; font-size: 14px; width: 100%;
  }
  .search-box input::placeholder { color: var(--text-muted); }

  select, .filter-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-main);
    border-radius: 10px;
    padding: 10px 14px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .filter-btn { color: var(--accent-gold); font-weight: 600; border-color: rgba(245,158,11,0.4); }
  .filter-btn.active { background: rgba(245,158,11,0.12); }

  .advanced-panel {
    display: none;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 14px;
  }
  .advanced-panel.open { display: flex; }
  .range-group { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-muted); }
  .range-group .inputs { display: flex; gap: 6px; align-items: center; }
  .range-group input {
    width: 90px; background: var(--bg-main); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; color: var(--text-main); font-family: inherit; font-size: 12px;
  }
  .apply-btn {
    background: var(--accent-cyan); color: #07090e; font-weight: 700;
    border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; align-self: flex-end;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  /* --- ESTILO TIPO ANALYSIS4NFT --- */
  .card {
    background: #0f131b;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    transition: all 0.2s ease;
    position: relative;
  }
  .card:hover {
    transform: translateY(-4px);
    z-index: 10;
  }
  /* Brillo al pasar el cursor dependiendo del grado del NFT */
  .card.grade-1:hover { border-color: var(--g1); box-shadow: 0 6px 15px rgba(156,163,175,0.15); }
  .card.grade-2:hover { border-color: var(--g2); box-shadow: 0 6px 15px rgba(34,197,94,0.15); }
  .card.grade-3:hover { border-color: var(--g3); box-shadow: 0 6px 15px rgba(59,130,246,0.2); }
  .card.grade-4:hover { border-color: var(--g4); box-shadow: 0 6px 15px rgba(168,85,247,0.25); }
  .card.grade-5:hover { border-color: var(--g5); box-shadow: 0 6px 15px rgba(245,158,11,0.3); }

  .card-img-wrap {
    position: relative;
    width: 100%;
    height: 240px;
    background: #000;
    overflow: hidden;
  }
  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
  }
  /* Degradado oscuro en la parte inferior de la imagen */
  .card-img-wrap::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(to top, #0f131b 0%, transparent 100%);
  }

  .overlay-top {
    position: absolute; top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; z-index: 2;
  }
  .badge {
    background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px; padding: 4px 8px; font-size: 11px; font-weight: 600;
  }
  .badge-server { color: var(--text-muted); }
  .badge-class { color: var(--accent-cyan); }
  .badge-trade { background: rgba(6,182,212,0.15); border-color: var(--accent-cyan); color: var(--accent-cyan); margin-left: 5px; }

  .overlay-bottom {
    position: absolute; bottom: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; align-items: flex-end; z-index: 2;
  }
  .stat-level { font-size: 14px; font-weight: 800; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
  .stat-power { font-size: 16px; font-weight: 800; color: var(--accent-gold); text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

  .card-content { padding: 12px; z-index: 3; position: relative; }
  .card-name { font-size: 16px; font-weight: 700; text-align: center; margin-bottom: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Cuadrícula de items 4x2 */
  .equip-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; justify-items: center; margin-bottom: 4px; }
  .equip-slot { width: 34px; height: 34px; border-radius: 6px; background: #1a2233; border: 1.5px solid var(--border); position: relative; }
  .equip-slot img { width: 100%; height: 100%; object-fit: contain; border-radius: 4px; }
  .equip-slot.g1 { border-color: var(--g1); }
  .equip-slot.g2 { border-color: var(--g2); }
  .equip-slot.g3 { border-color: var(--g3); }
  .equip-slot.g4 { border-color: var(--g4); }
  .equip-slot.g5 { border-color: var(--g5); }
  
  /* Arreglo para que el item trade conserve el color de su grado */
  .equip-slot.trade { box-shadow: 0 0 6px rgba(6,182,212,0.4); }
  .equip-slot.trade::after {
    content: 'T'; position: absolute; top: -1px; right: -1px;
    width: 12px; height: 12px; border-radius: 0 5px 0 4px;
    background: var(--accent-cyan); color: #07090e;
    font-size: 9px; font-weight: 800; line-height: 12px; text-align: center;
  }

  .card-footer {
    background: rgba(255,255,255,0.02);
    border-top: 1px solid rgba(255,255,255,0.05);
    padding: 12px; text-align: center; margin-top: auto;
  }
  .price-wemix { font-size: 16px; font-weight: 800; color: #fff; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .price-wemix::before {
    content: 'W'; display: inline-block; width: 18px; height: 18px;
    background: #fff; color: #000; border-radius: 50%; font-size: 11px;
    line-height: 18px; font-weight: 900;
  }
  /* --- FIN ESTILO ANALYSIS4NFT --- */

  .empty-state, .loading-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; }
  .error-state { color: var(--accent-red); }

  .pagination { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 30px; }
  .pagination button {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .pagination button.active { background: var(--accent-cyan); color: #07090e; font-weight: 700; border-color: var(--accent-cyan); }
  .pagination button:disabled { opacity: 0.35; cursor: default; }
  .pagination .dots { color: var(--text-muted); padding: 0 4px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top-bar">
    <div class="brand">
      <h1>MIR4 NFT Marketplace</h1>
      <span id="subtitle">Conectando con el servidor…</span>
    </div>
  </div>

  <div class="controls">
    <div class="search-box">
      <span>Buscar</span>
      <input type="text" id="searchInput" placeholder="Buscar por nombre, clase o servidor…" oninput="aplicarFiltros()">
    </div>
    <select id="sortBy" onchange="aplicarFiltros()">
      <option value="recent">Ordenar: recientes</option>
      <option value="power-desc">Poder: mayor a menor</option>
      <option value="price-asc">Precio: menor a mayor</option>
      <option value="price-desc">Precio: mayor a menor</option>
      <option value="level-desc">Nivel: mayor a menor</option>
    </select>
    <select id="classFilter" onchange="aplicarFiltros()"><option value="">Todas las clases</option></select>
    <select id="serverFilter" onchange="aplicarFiltros()"><option value="">Todos los servidores</option></select>
    <button class="filter-btn" id="advToggle" onclick="toggleAdvanced()">Avanzado</button>
  </div>

  <div class="advanced-panel" id="advancedPanel">
    <div class="range-group">
      <span>Poder (PS)</span>
      <div class="inputs">
        <input type="number" id="powerMin" placeholder="Min">
        <input type="number" id="powerMax" placeholder="Max">
      </div>
    </div>
    <div class="range-group">
      <span>Precio (WEMIX)</span>
      <div class="inputs">
        <input type="number" id="priceMin" placeholder="Min">
        <input type="number" id="priceMax" placeholder="Max">
      </div>
    </div>
    <div class="range-group">
      <span>Nivel</span>
      <div class="inputs">
        <input type="number" id="lvlMin" placeholder="Min">
        <input type="number" id="lvlMax" placeholder="Max">
      </div>
    </div>
    <div class="range-group">
      <span>Items Trade (Grado)</span>
      <div class="inputs">
        <select id="tradeGrade">
          <option value="">Todos</option>
          <option value="any">Cualquier Grado</option>
          <option value="2">Grado 2+ (Verde)</option>
          <option value="3">Grado 3+ (Azul)</option>
          <option value="4">Grado 4+ (Épico)</option>
          <option value="5">Grado 5 (Legendario)</option>
        </select>
      </div>
    </div>
    <button class="apply-btn" onclick="aplicarFiltros()">Aplicar</button>
  </div>

  <div class="grid" id="grid"><div class="loading-state">Cargando personajes...</div></div>
  <div class="pagination" id="pagination"></div>

</div>

<script>
const URL_API = "https://mir4-backend.onrender.com/api/nfts";
const PAGE_SIZE = 25;
let TODOS = [];
let FILTRADOS = [];
let PAGINA_ACTUAL = 1;

async function cargarMercado() {
  const grid = document.getElementById('grid');
  const subtitle = document.getElementById('subtitle');
  try {
    const res = await fetch(URL_API);
    const data = await res.json();
    TODOS = data.items || [];
    subtitle.innerText = data.diagnostico || (TODOS.length + " personajes disponibles");
    poblarSelect('classFilter', [...new Set(TODOS.map(n => n.class).filter(Boolean))].sort());
    poblarSelect('serverFilter', [...new Set(TODOS.map(n => n.server).filter(Boolean))].sort());
    aplicarFiltros();
  } catch (err) {
    console.error(err);
    grid.innerHTML = '<div class="empty-state error-state">No se pudo conectar con el servidor. Puede estar iniciando (los servicios gratuitos de Render tardan ~1 min) - recarga en un momento.</div>';
    subtitle.innerText = "Error de conexion";
  }
}

function poblarSelect(id, valores) {
  const select = document.getElementById(id);
  valores.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    select.appendChild(opt);
  });
}

function toggleAdvanced() {
  document.getElementById('advancedPanel').classList.toggle('open');
  document.getElementById('advToggle').classList.toggle('active');
}

function aplicarFiltros() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const claseSel = document.getElementById('classFilter').value;
  const serverSel = document.getElementById('serverFilter').value;
  const orden = document.getElementById('sortBy').value;
  const powerMin = parseFloat(document.getElementById('powerMin').value) || null;
  const powerMax = parseFloat(document.getElementById('powerMax').value) || null;
  const priceMin = parseFloat(document.getElementById('priceMin').value) || null;
  const priceMax = parseFloat(document.getElementById('priceMax').value) || null;
  const lvlMin = parseFloat(document.getElementById('lvlMin').value) || null;
  const lvlMax = parseFloat(document.getElementById('lvlMax').value) || null;
  const tradeGrade = document.getElementById('tradeGrade') ? document.getElementById('tradeGrade').value : '';

  FILTRADOS = TODOS.filter(n => {
    const texto = (n.name + " " + n.class + " " + n.server).toLowerCase();
    if (!texto.includes(query)) return false;
    if (claseSel && n.class !== claseSel) return false;
    if (serverSel && n.server !== serverSel) return false;
    if (powerMin !== null && (n.power || 0) < powerMin) return false;
    if (powerMax !== null && (n.power || 0) > powerMax) return false;
    if (priceMin !== null && (n.price_wemix || 0) < priceMin) return false;
    if (priceMax !== null && (n.price_wemix || 0) > priceMax) return false;
    if (lvlMin !== null && (n.level || 0) < lvlMin) return false;
    if (lvlMax !== null && (n.level || 0) > lvlMax) return false;
    
    // Lógica para filtrar items Trade por grado
    if (tradeGrade === 'any' && !(n.tradable_item_count > 0)) return false;
    if (tradeGrade !== '' && tradeGrade !== 'any') {
      const minGrade = parseInt(tradeGrade);
      // Verifica si el personaje tiene equipo y si alguno de esos equipos es tradeable y cumple con el grado mínimo
      const tieneTradeGrado = n.equipment && n.equipment.some(e => e.tradeable && e.grade >= minGrade);
      if (!tieneTradeGrado) return false;
    }
    
    return true;
  });

  if (orden === 'power-desc') FILTRADOS.sort((a, b) => (b.power || 0) - (a.power || 0));
  else if (orden === 'price-asc') FILTRADOS.sort((a, b) => (a.price_wemix ?? Infinity) - (b.price_wemix ?? Infinity));
  else if (orden === 'price-desc') FILTRADOS.sort((a, b) => (b.price_wemix ?? -1) - (a.price_wemix ?? -1));
  else if (orden === 'level-desc') FILTRADOS.sort((a, b) => (b.level || 0) - (a.level || 0));

  PAGINA_ACTUAL = 1;
  renderizarPagina();
}

function renderizarPagina() {
  const grid = document.getElementById('grid');
  if (FILTRADOS.length === 0) {
    grid.innerHTML = '<div class="empty-state">Ningun personaje coincide con esa busqueda.</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  const totalPaginas = Math.ceil(FILTRADOS.length / PAGE_SIZE);
  const inicio = (PAGINA_ACTUAL - 1) * PAGE_SIZE;
  const lote = FILTRADOS.slice(inicio, inicio + PAGE_SIZE);

  grid.innerHTML = lote.map(function(nft) {
    const grade = nft.grade || 0;
    const tradeCount = nft.tradable_item_count || 0;

    const equipo = nft.equipment || [];
    let equipStrip = '';
    if (equipo.length) {
      equipStrip = '<div class="equip-grid">' + equipo.map(function(e) {
        const cls = 'equip-slot g' + (e.grade || 0) + (e.tradeable ? ' trade' : '');
        const title = e.name + (e.tradeable ? ' (Trade)' : '');
        return '<div class="' + cls + '" title="' + title + '"><img src="' + e.icon + '" alt="' + e.name + '" loading="lazy" onerror="this.style.opacity=0"></div>';
      }).join('') + '</div>';
    }

    return '' +
      '<a class="card grade-' + grade + '" href="' + nft.url + '" target="_blank" rel="noopener">' +
        '<div class="card-img-wrap">' +
          '<img src="' + nft.image + '" alt="' + nft.name + '" loading="lazy" onerror="this.src=\'https://www.xdraco.com/nft/assets/img/common/thumb-default.png\'">' +
          '<div class="overlay-top">' +
            '<span class="badge badge-server">' + (nft.server || '') + '</span>' +
            '<div>' +
              '<span class="badge badge-class">' + (nft.class || 'N/A') + '</span>' +
              (tradeCount > 0 ? '<span class="badge badge-trade">' + tradeCount + ' Trade</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="overlay-bottom">' +
            '<span class="stat-level">Lv. ' + (nft.level ?? '-') + '</span>' +
            '<span class="stat-power">PS ' + (nft.power || 0).toLocaleString() + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="card-content">' +
          '<div class="card-name" title="' + nft.name + '">' + nft.name + '</div>' +
          equipStrip +
        '</div>' +
        '<div class="card-footer">' +
          '<div class="price-wemix">' + (nft.price_wemix ?? 0).toLocaleString() + '</div>' +
        '</div>' +
      '</a>';
  }).join('');

  renderizarPaginacion(totalPaginas);
}

function renderizarPaginacion(totalPaginas) {
  const cont = document.getElementById('pagination');
  if (totalPaginas <= 1) { cont.innerHTML = ''; return; }

  let botones = [];
  botones.push('<button ' + (PAGINA_ACTUAL === 1 ? 'disabled' : '') + ' onclick="irAPagina(' + (PAGINA_ACTUAL - 1) + ')">Anterior</button>');

  const ventana = 2;
  for (let p = 1; p <= totalPaginas; p++) {
    if (p === 1 || p === totalPaginas || (p >= PAGINA_ACTUAL - ventana && p <= PAGINA_ACTUAL + ventana)) {
      botones.push('<button class="' + (p === PAGINA_ACTUAL ? 'active' : '') + '" onclick="irAPagina(' + p + ')">' + p + '</button>');
    } else if (p === PAGINA_ACTUAL - ventana - 1 || p === PAGINA_ACTUAL + ventana + 1) {
      botones.push('<span class="dots">...</span>');
    }
  }

  botones.push('<button ' + (PAGINA_ACTUAL === totalPaginas ? 'disabled' : '') + ' onclick="irAPagina(' + (PAGINA_ACTUAL + 1) + ')">Siguiente</button>');
  cont.innerHTML = botones.join('');
}

function irAPagina(p) {
  PAGINA_ACTUAL = p;
  renderizarPagina();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

cargarMercado();
</script>
</body>
</html>
