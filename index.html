<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIR4 NFT Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #07090e;
    --bg-card: #0d111a;
    --bg-card-hover: #131b2e;
    --border: #1e293b;
    --accent-gold: #f59e0b;
    --accent-cyan: #06b6d4;
    --accent-red: #ef4444;
    --text-main: #f8fafc;
    --text-muted: #8892a6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-main);
    color: var(--text-main);
    font-family: 'Outfit', system-ui, sans-serif;
    padding: 18px;
  }

  .wrap { max-width: 1400px; margin: 0 auto; }

  .top-bar {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 14px;
  }

  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
  .brand span { font-size: 12px; color: var(--text-muted); }

  .status-tabs { display: flex; gap: 6px; }
  .status-tabs button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .status-tabs button.active {
    background: rgba(245, 158, 11, 0.12);
    border-color: var(--accent-gold);
    color: var(--accent-gold);
  }
  .status-tabs .count {
    background: var(--accent-red);
    color: #fff;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 6px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }

  .search-box {
    flex: 1 1 260px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .search-box input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-main);
    font-family: inherit;
    font-size: 14px;
    width: 100%;
  }
  .search-box input::placeholder { color: var(--text-muted); }

  select, .filter-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-main);
    border-radius: 10px;
    padding: 10px 14px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .filter-btn { color: var(--accent-gold); font-weight: 600; border-color: rgba(245,158,11,0.4); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 12px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent-cyan);
  }
  .card:focus-visible {
    outline: 2px solid var(--accent-cyan);
    outline-offset: 2px;
  }

  .card-img {
    position: relative;
    width: 100%;
    height: 130px;
    background: #111827;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card-img img { width: 100%; height: 100%; object-fit: contain; }

  .tag-class {
    position: absolute;
    top: 6px;
    left: 6px;
    background: rgba(0,0,0,0.75);
    color: var(--accent-cyan);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 5px;
    border: 1px solid rgba(6,182,212,0.35);
  }

  .tag-auction {
    position: absolute;
    top: 6px;
    right: 6px;
    background: rgba(245,158,11,0.15);
    color: var(--accent-gold);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 5px;
    border: 1px solid rgba(245,158,11,0.4);
  }

  .card-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-stats {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
  }
  .card-stats strong { color: var(--text-main); }
  .card-server { font-size: 10px; color: var(--text-muted); }

  .card-footer {
    padding: 8px 12px 12px;
    border-top: 1px solid var(--border);
    margin-top: auto;
  }
  .price-wemix { font-size: 13px; font-weight: 700; color: var(--accent-gold); }
  .price-usd { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  .empty-state, .loading-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .error-state { color: var(--accent-red); }

  @media (max-width: 480px) {
    .top-bar { flex-direction: column; align-items: flex-start; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top-bar">
    <div class="brand">
      <h1>MIR4 NFT Marketplace</h1>
      <span id="subtitle">Conectando con WEMIX PLAY…</span>
    </div>
    <div class="status-tabs">
      <button class="active">🔥 En venta<span class="count" id="total-count">0</span></button>
    </div>
  </div>

  <div class="controls">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar por nombre, clase o servidor…" oninput="aplicarFiltros()">
    </div>
    <select id="sortBy" onchange="aplicarFiltros()">
      <option value="recent">Ordenar: recientes</option>
      <option value="power-desc">Poder: mayor a menor</option>
      <option value="price-asc">Precio: menor a mayor</option>
      <option value="price-desc">Precio: mayor a menor</option>
      <option value="level-desc">Nivel: mayor a menor</option>
    </select>
    <select id="classFilter" onchange="aplicarFiltros()">
      <option value="">Todas las clases</option>
    </select>
  </div>

  <div class="grid" id="grid">
    <div class="loading-state">Cargando personajes desde WEMIX PLAY…</div>
  </div>

</div>

<script>
const URL_API = "https://mir4-backend.onrender.com/api/nfts";
let TODOS = [];

function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatNumber(value, fallback = '—') {
  const num = Number(value);
  return Number.isFinite(num) ? num.toLocaleString() : fallback;
}

function safeText(value, fallback = '') {
  const text = String(value ?? '').trim();
  return text || fallback;
}

async function cargarMercado() {
  const grid = document.getElementById('grid');
  const subtitle = document.getElementById('subtitle');

  try {
    const res = await fetch(URL_API);

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const data = await res.json();
    TODOS = Array.isArray(data.items) ? data.items : [];

    document.getElementById('total-count').innerText = TODOS.length;
    subtitle.innerText = data.diagnostico || `${TODOS.length} personajes disponibles`;

    poblarFiltroClases(TODOS);
    aplicarFiltros();
  } catch (err) {
    console.error(err);
    grid.innerHTML = `<div class="empty-state error-state">No se pudo conectar con el servidor. Puede estar iniciando (los servicios gratuitos de Render tardan ~1 min en despertar) — recarga en un momento.</div>`;
    subtitle.innerText = "Error de conexión";
  }
}

function poblarFiltroClases(lista) {
  const select = document.getElementById('classFilter');
  const clases = [...new Set(lista.map(n => n.class).filter(Boolean))].sort();

  clases.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    select.appendChild(opt);
  });
}

function aplicarFiltros() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const claseSel = document.getElementById('classFilter').value;
  const orden = document.getElementById('sortBy').value;

  let filtrados = TODOS.filter(n => {
    const texto = `${n.name || ''} ${n.class || ''} ${n.server || ''}`.toLowerCase();
    const coincideTexto = texto.includes(query);
    const coincideClase = !claseSel || n.class === claseSel;
    return coincideTexto && coincideClase;
  });

  if (orden === 'power-desc') filtrados.sort((a, b) => (Number(b.power) || 0) - (Number(a.power) || 0));
  else if (orden === 'price-asc') filtrados.sort((a, b) => {
    const ap = Number(a.price_wemix);
    const bp = Number(b.price_wemix);
    return (Number.isFinite(ap) ? ap : Infinity) - (Number.isFinite(bp) ? bp : Infinity);
  });
  else if (orden === 'price-desc') filtrados.sort((a, b) => {
    const ap = Number(a.price_wemix);
    const bp = Number(b.price_wemix);
    return (Number.isFinite(bp) ? bp : -1) - (Number.isFinite(ap) ? ap : -1);
  });
  else if (orden === 'level-desc') filtrados.sort((a, b) => (Number(b.level) || 0) - (Number(a.level) || 0));

  renderizar(filtrados);
}

function renderizar(lista) {
  const grid = document.getElementById('grid');

  if (lista.length === 0) {
    grid.innerHTML = `<div class="empty-state">Ningún personaje coincide con esa búsqueda.</div>`;
    return;
  }

  grid.innerHTML = lista.map(nft => {
    const nftId = safeText(nft.id, '');
    const nftName = escapeHtml(nft.name || 'Sin nombre');
    const nftClass = escapeHtml(nft.class || 'N/A');
    const nftServer = escapeHtml(nft.server || '');
    const nftImage = escapeHtml(
      nft.image || 'https://www.xdraco.com/nft/assets/img/common/thumb-default.png'
    );
    const nftUrl = nft.url ? escapeHtml(nft.url) : '#';

    const auctionTag = nft.is_auction ? `<span class="tag-auction">🔨 Subasta</span>` : '';
    const precioUsd = Number(nft.price_usd);
    const precioUsdTxt = Number.isFinite(precioUsd) ? `≈ $${precioUsd.toLocaleString()}` : '';
    const powerTxt = formatNumber(nft.power, '0');
    const levelTxt = formatNumber(nft.level, '—');
    const wemixTxt = formatNumber(nft.price_wemix, '0');
    const enhancementTxt = formatNumber(nft.enhancement, '0');

    return `
      <a class="card" href="${nftUrl}" target="_blank" rel="noopener noreferrer">
        <div class="card-img">
          <span class="tag-class">${nftClass}</span>
          ${auctionTag}
          <img src="${nftImage}" alt="${nftName}" loading="lazy"
               onerror="this.onerror=null;this.src='https://www.xdraco.com/nft/assets/img/common/thumb-default.png'">
        </div>
        <div class="card-body">
          <div class="card-title" title="${nftName}">${nftName}</div>
          <div class="card-stats">
            <span>Lv. <strong>${levelTxt}</strong></span>
            <span>PS: <strong>${powerTxt}</strong></span>
          </div>
          <div class="card-server">${nftServer}</div>
        </div>
        <div class="card-footer">
          <div class="price-wemix">${wemixTxt} WEMIX</div>
          <div class="price-usd">${precioUsdTxt}</div>
        </div>
      </a>
    `;
  }).join('');
}

document.addEventListener('DOMContentLoaded', cargarMercado);
</script>
</body>
</html>
