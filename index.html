<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIR4 NFT Marketplace Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #07090e;
    --bg-card: #0d111a;
    --bg-card-hover: #131b2e;
    --border-color: #1e293b;
    --accent-red: #ef4444;
    --accent-gold: #f59e0b;
    --accent-cyan: #06b6d4;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Outfit', sans-serif; padding: 15px; }

  .wrapper { max-width: 1400px; margin: 0 auto; }

  /* BARRA DE NAVEGACIÓN SUPERIOR EXACTA */
  .market-header {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .header-left, .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .status-tab {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-tab.active { background: #1e293b; color: #fff; border-color: #334155; }
  .status-tab .badge-red { background: var(--accent-red); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 4px; }

  /* BUSCADOR CENTRAL */
  .search-box {
    position: relative;
    flex-grow: 1;
    max-width: 350px;
  }
  .search-box input {
    width: 100%;
    background: #07090e;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 8px 12px 8px 35px;
    color: #fff;
    font-size: 13px;
    outline: none;
  }
  .search-box input:focus { border-color: var(--accent-cyan); }
  .search-box span { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }

  .filter-select {
    background: #07090e;
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }

  .btn-advanced {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #000;
    border: none;
    padding: 7px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  /* CUADRÍCULA DE TARJETAS TIPO HOFGAMER */
  .nft-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
  }

  .nft-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
  }

  .nft-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent-cyan);
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
  }

  .card-img-container {
    width: 100%;
    height: 140px;
    background: #111827;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card-img-container img { width: 100%; height: 100%; object-fit: cover; }

  .class-tag {
    position: absolute;
    top: 6px;
    left: 6px;
    background: rgba(0,0,0,0.7);
    color: var(--accent-cyan);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid rgba(6, 182, 212, 0.3);
  }

  .card-body { padding: 10px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; justify-content: space-between; }
  .card-title { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .card-stats { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); }
  .card-stats span strong { color: #fff; }
  .card-stats .lvl { color: var(--accent-red); font-weight: 700; }

  .card-price-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border-color);
    padding-top: 6px;
    margin-top: 4px;
  }
  .price-wemix { font-size: 13px; font-weight: 700; color: var(--accent-gold); }
  .price-fiat { font-size: 10px; color: var(--text-muted); }

  .loading-msg { text-align: center; padding: 60px; color: var(--text-muted); grid-column: span 5; }
</style>
</head>
<body>

<div class="wrapper">
  <!-- CABECERA DE FILTROS Y BÚSQUEDA -->
  <div class="market-header">
    <div class="header-left">
      <button class="status-tab active">🔥 For Sale <span class="badge-red" id="total-count">0</span></button>
      <button class="status-tab">Sold</button>
      <button class="status-tab">Delisted</button>
    </div>

    <!-- Buscador interactivo -->
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Search Character / NFT ID..." oninput="filtrarNfts()">
    </div>

    <div class="header-right">
      <select class="filter-select" id="sortBy" onchange="filtrarNfts()">
        <option value="recent">Sort: Time</option>
        <option value="power">Power Score (High)</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
      </select>
      <button class="btn-advanced">⚡ Advanced</button>
    </div>
  </div>

  <!-- CUADRÍCULA DE NFTs -->
  <div class="nft-grid" id="grid-container">
    <div class="loading-msg">Cargando mercado de personajes desde el backend...</div>
  </div>
</div>

<script>
  const URL_API = "https://mir4-backend.onrender.com/api/nfts";
  let todosLosNfts = [];

  async function cargarMercado() {
    try {
      const res = await fetch(URL_API);
      const data = await res.json();
      todosLosNfts = data.items || [];
      
      document.getElementById('total-count').innerText = todosLosNfts.length;
      renderizarNfts(todosLosNfts);
    } catch (e) {
      console.error(e);
      document.getElementById('grid-container').innerHTML = `<div class="loading-msg" style="color:var(--accent-red);">Error al conectar con el servidor backend.</div>`;
    }
  }

  function renderizarNfts(lista) {
    const container = document.getElementById('grid-container');
    
    if (lista.length === 0) {
      container.innerHTML = `<div class="loading-msg">No se encontraron personajes con esos filtros.</div>`;
      return;
    }

    container.innerHTML = lista.map(nft => {
      // Extraemos ID de la URL o usamos un identificador único
      const nftId = nft.id || nft.url.split('/').pop();
      
      return `
        <a href="detalle.html?id=${nftId}&url=${encodeURIComponent(nft.url)}" class="nft-card">
          <div class="card-img-container">
            <span class="class-tag">${nft.class || 'LANCER'}</span>
            <img src="https://www.xdraco.com/nft/assets/img/common/thumb-default.png" alt="${nft.name}">
          </div>
          <div class="card-body">
            <div class="card-title">${nft.name}</div>
            <div class="card-stats">
              <span class="lvl">Lv.${nft.level}</span>
              <span>PS: <strong>${nft.power}</strong></span>
            </div>
            <div class="card-price-row">
              <span class="price-wemix">💎 ${nft.price}</span>
              <span class="price-fiat">~$1,200</span>
            </div>
          </div>
        </a>
      `;
    }).join('');
  }

  function filtrarNfts() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const sortMethod = document.getElementById('sortBy').value;

    // Filtrar por texto o ID
    let filtrados = todosLosNfts.filter(nft => {
      const nameMatch = nft.name.toLowerCase().includes(query);
      const idMatch = nft.url.toLowerCase().includes(query) || (nft.id && nft.id.toString().includes(query));
      return nameMatch || idMatch;
    });

    // Ordenar resultados
    if (sortMethod === 'power') {
      filtrados.sort((a, b) => parseInt(b.power.replace(/,/g, '')) - parseInt(a.power.replace(/,/g, '')));
    } else if (sortMethod === 'price-asc') {
      filtrados.sort((a, b) => parseFloat(a.price.replace(/,/g, '')) - parseFloat(b.price.replace(/,/g, '')));
    } else if (sortMethod === 'price-desc') {
      filtrados.sort((a, b) => parseFloat(b.price.replace(/,/g, '')) - parseFloat(a.price.replace(/,/g, '')));
    }

    renderizarNfts(filtrados);
  }

  cargarMercado();
</script>

</body>
</html>
