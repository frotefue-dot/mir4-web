<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIR4 NFT Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #07090e;
    --bg-card: #0d111a;
    --bg-card-hover: #131b2e;
    --border: #1e293b;
    --accent-gold: #f59e0b;
    --accent-cyan: #06b6d4;
    --accent-red: #ef4444;
    --text-main: #f8fafc;
    --text-muted: #8892a6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-main);
    color: var(--text-main);
    font-family: 'Outfit', system-ui, sans-serif;
    padding: 18px;
  }

  .wrap { max-width: 1400px; margin: 0 auto; }

  .top-bar {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 14px;
  }

  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; color: var(--text-main); }
  .brand span { font-size: 12px; color: var(--text-muted); }

  .status-tabs { display: flex; gap: 6px; }
  .status-tabs button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
  }
  .status-tabs button.active {
    background: rgba(245, 158, 11, 0.12);
    border-color: var(--accent-gold);
    color: var(--accent-gold);
  }
  .status-tabs .count {
    background: var(--accent-red);
    color: #fff;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 6px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }

  .search-box {
    flex: 1 1 260px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .search-box input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-main);
    font-family: inherit;
    font-size: 14px;
    width: 100%;
  }
  .search-box input::placeholder { color: var(--text-muted); }

  select {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-main);
    border-radius: 10px;
    padding: 10px 14px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: var(--accent-cyan); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent-cyan);
    box-shadow: 0 8px 20px rgba(6, 182, 212, 0.12);
  }

  .card-img {
    position: relative;
    width: 100%;
    height: 140px;
    background: #111827;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  .card-img img { width: 100%; height: 100%; object-fit: contain; }

  .tag-class {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0,0,0,0.8);
    color: var(--accent-cyan);
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid rgba(6,182,212,0.35);
    text-transform: uppercase;
  }

  .tag-trade {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(59,130,246,0.85);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
  }

  .equip-strip {
    display: flex;
    gap: 4px;
    padding: 8px 12px 0;
    flex-wrap: wrap;
  }
  .equip-slot {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    background: #111827;
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .equip-slot img { width: 100%; height: 100%; object-fit: contain; }
  .equip-slot.trade { border: 1px solid var(--accent-cyan); box-shadow: 0 0 5px rgba(6,182,212,0.6); }

  .card-body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
  .card-title {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text-main);
  }
  .card-stats {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    gap: 8px;
  }
  .card-stats strong { color: var(--text-main); }
  .card-server { font-size: 11px; color: var(--text-muted); }

  .card-footer {
    padding: 10px 12px 14px;
    border-top: 1px solid var(--border);
    margin-top: auto;
    background: rgba(0,0,0,0.15);
  }
  .price-wemix { font-size: 15px; font-weight: 800; color: var(--accent-gold); }

  .empty-state, .loading-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .error-state { color: var(--accent-red); }

  @media (max-width: 480px) {
    .top-bar { flex-direction: column; align-items: flex-start; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <div class="brand">
      <h1>MIR4 NFT Marketplace</h1>
      <span id="subtitle">Conectando con el backend…</span>
    </div>
    <div class="status-tabs">
      <button class="active">🔥 En venta<span class="count" id="total-count">0</span></button>
    </div>
  </div>

  <div class="controls">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar por nombre, clase o servidor…" oninput="aplicarFiltros()">
    </div>
    <select id="sortBy" onchange="aplicarFiltros()">
      <option value="recent">Ordenar: recientes</option>
      <option value="power-desc">Poder: mayor a menor</option>
      <option value="price-asc">Precio: menor a mayor</option>
      <option value="price-desc">Precio: mayor a menor</option>
      <option value="level-desc">Nivel: mayor a menor</option>
    </select>
    <select id="classFilter" onchange="aplicarFiltros()">
      <option value="">Todas las clases</option>
    </select>
  </div>

  <div class="grid" id="grid">
    <div class="loading-state">Cargando personajes…</div>
  </div>
</div>

<script>
const URL_API = "https://mir4-backend.onrender.com/api/nfts";
let TODOS = [];

async function cargarMercado() {
  const grid = document.getElementById('grid');
  const subtitle = document.getElementById('subtitle');

  try {
    const res = await fetch(URL_API);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    TODOS = Array.isArray(data.items) ? data.items : [];

    document.getElementById('total-count').innerText = TODOS.length;
    subtitle.innerText = data.diagnostico || `${TODOS.length} personajes disponibles`;

    poblarFiltroClases(TODOS);
    aplicarFiltros();
  } catch (err) {
    console.error(err);
    grid.innerHTML = `<div class="empty-state error-state">No se pudo conectar con el servidor. Puede estar iniciando.</div>`;
    subtitle.innerText = "Error de conexión";
  }
}

function poblarFiltroClases(lista) {
  const select = document.getElementById('classFilter');
  const clases = [...new Set(lista.map(n => n.class).filter(Boolean))].sort();

  select.innerHTML = '<option value="">Todas las clases</option>';
  clases.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    select.appendChild(opt);
  });
}

function aplicarFiltros() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const claseSel = document.getElementById('classFilter').value;
  const orden = document.getElementById('sortBy').value;

  let filtrados = TODOS.filter(n => {
    const texto = `${n.name || ''} ${n.class || ''} ${n.server || ''}`.toLowerCase();
    const coincideTexto = texto.includes(query);
    const coincideClase = !claseSel || n.class === claseSel;
    return coincideTexto && coincideClase;
  });

  if (orden === 'power-desc') filtrados.sort((a, b) => (b.power || 0) - (a.power || 0));
  else if (orden === 'price-asc') filtrados.sort((a, b) => (a.price_wemix ?? Infinity) - (b.price_wemix ?? Infinity));
  else if (orden === 'price-desc') filtrados.sort((a, b) => (b.price_wemix ?? -1) - (a.price_wemix ?? -1));
  else if (orden === 'level-desc') filtrados.sort((a, b) => (b.level || 0) - (a.level || 0));

  renderizar(filtrados);
}

function escapeHtml(text) {
  return String(text)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function formatNumber(value) {
  if (value === null || value === undefined || value === '') return 'N/A';
  const n = Number(value);
  if (Number.isNaN(n)) return String(value);
  return n.toLocaleString('en-US');
}

function renderizar(lista) {
  const grid = document.getElementById('grid');

  if (lista.length === 0) {
    grid.innerHTML = `<div class="empty-state">Ningún personaje coincide con esa búsqueda.</div>`;
    return;
  }

  grid.innerHTML = lista.map(nft => {
    const safeName = escapeHtml(nft.name || 'Sin nombre');
    const safeClass = escapeHtml(nft.class || 'N/A');
    const safeServer = escapeHtml(nft.server || 'N/A');
    const safeImage = escapeHtml(nft.image || 'https://www.xdraco.com/nft/assets/img/common/thumb-default.png');
    const safeUrl = escapeHtml(nft.url || '#');

    const levelText = nft.level ?? 'N/A';
    const powerText = nft.power ? formatNumber(nft.power) : 'N/A';
    const priceText = nft.price_wemix !== undefined && nft.price_wemix !== null
      ? formatNumber(nft.price_wemix)
      : 'Consultar';

    const tradeables = Array.isArray(nft.tradeable_equipment) ? nft.tradeable_equipment : [];
    const equipment = Array.isArray(nft.equipment) ? nft.equipment : [];

    const equipBadges = equipment.map(slot => {
      const cls = slot.tradeable ? 'equip-slot trade' : 'equip-slot';
      return `
        <div class="${cls}" title="${escapeHtml(slot.name || 'Slot')}">
          ${slot.icon ? `<img src="${escapeHtml(slot.icon)}" alt="">` : ''}
        </div>
      `;
    }).join('');

    const tradeableBadges = tradeables.map(slot => `
      <div class="equip-slot trade" title="${escapeHtml(slot.name || 'Tradeable')}">
        ${slot.icon ? `<img src="${escapeHtml(slot.icon)}" alt="">` : ''}
      </div>
    `).join('');

    return `
      <a class="card" href="${safeUrl}" target="_blank" rel="noopener">
        <div class="card-img">
          <img src="${safeImage}" alt="${safeName}" loading="lazy">
          <div class="tag-class">${safeClass}</div>
          <div class="tag-trade">${tradeables.length > 0 ? 'TRADEABLE' : 'NO TRADEABLE'}</div>
        </div>

        <div class="equip-strip">
          ${equipBadges}
        </div>

        <div class="equip-strip" style="padding-top:6px;">
          ${tradeableBadges}
        </div>

        <div class="card-body">
          <div class="card-title">${safeName}</div>
          <div class="card-stats">
            <span>Nivel: <strong>${levelText}</strong></span>
            <span>Poder: <strong>${powerText}</strong></span>
          </div>
          <div class="card-server">Servidor: ${safeServer}</div>
        </div>

        <div class="card-footer">
          <div class="price-wemix">${priceText} WEMIX</div>
        </div>
      </a>
    `;
  }).join('');
}

document.addEventListener('DOMContentLoaded', cargarMercado);
</script>
</body>
</html>
