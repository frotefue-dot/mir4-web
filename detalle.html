<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIR4 NFT Detail</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #07090e;
    --bg-card: #0d111a;
    --bg-card-hover: #131b2e;
    --border: #1e293b;
    --accent-gold: #f59e0b;
    --accent-cyan: #06b6d4;
    --accent-red: #ef4444;
    --accent-blue: #3b82f6;
    --text-main: #f8fafc;
    --text-muted: #8892a6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-main);
    color: var(--text-main);
    font-family: 'Outfit', system-ui, sans-serif;
    padding: 24px;
    min-height: 100vh;
  }

  .page-shell {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* Back navigation */
  .back-nav {
    margin-bottom: -10px;
  }
  .back-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }
  .back-btn:hover {
    color: var(--text-main);
    border-color: var(--accent-cyan);
  }

  /* Hero Card */
  .hero-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    display: grid;
    grid-template-columns: 220px 1fr 280px;
    gap: 28px;
    align-items: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .hero-left { display: flex; justify-content: center; }
  .avatar-box {
    position: relative;
    width: 180px;
    height: 180px;
    background: #111827;
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar-img { width: 100%; height: 100%; object-fit: contain; }
  .rarity-badge {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .rarity-badge.legendary { background: rgba(245, 158, 11, 0.9); color: #000; }
  .rarity-badge.epic { background: rgba(168, 85, 247, 0.9); color: #fff; }
  .rarity-badge.rare { background: rgba(59, 130, 246, 0.9); color: #fff; }

  .hero-center { display: flex; flex-direction: column; gap: 10px; }
  .eyebrow { font-size: 12px; font-weight: 700; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 1px; }
  .hero-title { font-size: 26px; font-weight: 800; color: var(--text-main); }
  .hero-subtitle { font-size: 14px; color: var(--text-muted); line-height: 1.4; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 6px;
  }
  .stat-card {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
  .stat-value { font-size: 15px; font-weight: 700; color: var(--text-main); }
  .stat-value.accent { color: var(--accent-cyan); }

  .hero-right {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-left: 20px;
    border-left: 1px solid var(--border);
  }
  .price-box { display: flex; flex-direction: column; gap: 4px; }
  .price-label { font-size: 12px; color: var(--text-muted); }
  .price-value { font-size: 24px; font-weight: 800; color: var(--accent-gold); display: flex; align-items: baseline; gap: 6px; }
  .price-value small { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .price-usd { font-size: 13px; color: var(--text-muted); }

  .action-row { display: flex; flex-direction: column; gap: 8px; }
  .btn {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    outline: none;
    text-align: center;
    transition: all 0.15s ease;
    text-decoration: none;
  }
  .btn-primary { background: var(--accent-gold); color: #000; }
  .btn-primary:hover { background: #d97706; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
  .btn-secondary:hover { border-color: var(--text-muted); background: rgba(255,255,255,0.03); }

  /* Inventory Section */
  .inventory-section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 14px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
  }
  .section-kicker { font-size: 11px; font-weight: 700; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 0.8px; }
  .section-title { font-size: 20px; font-weight: 700; color: var(--text-main); }

  .filter-bar { display: flex; gap: 6px; }
  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-btn.active { background: rgba(6,182,212,0.12); border-color: var(--accent-cyan); color: var(--accent-cyan); }

  .inventory-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .inventory-panel {
    background: #090d16;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .panel-title { font-size: 15px; font-weight: 700; color: var(--text-main); }
  .panel-subtitle { font-size: 12px; color: var(--text-muted); }
  .count-badge {
    background: rgba(59,130,246,0.15);
    color: var(--accent-blue);
    font-size: 12px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    border: 1px solid rgba(59,130,246,0.3);
  }
  .count-badge.muted { background: rgba(136,146,166,0.12); color: var(--text-muted); border-color: var(--border); }

  .item-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
  }
  .item-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 6px;
    position: relative;
  }
  .item-card.tradeable { border-color: rgba(6,182,212,0.4); }
  .item-card.bound { border-color: var(--border); opacity: 0.85; }

  .item-state {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 9px;
    font-weight: 800;
    padding: 2px 5px;
    border-radius: 4px;
    background: rgba(6,182,212,0.2);
    color: var(--accent-cyan);
  }
  .item-state.bound-state { background: rgba(136,146,166,0.2); color: var(--text-muted); }

  .item-icon {
    width: 48px;
    height: 48px;
    background: #111827;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-top: 10px;
  }
  .item-icon img { width: 100%; height: 100%; object-fit: contain; }
  .item-name { font-size: 13px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
  .item-meta { font-size: 11px; color: var(--text-muted); }

  .loading-state, .error-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .error-state { color: var(--accent-red); }

  @media (max-width: 900px) {
    .hero-card { grid-template-columns: 1fr; text-align: center; }
    .hero-left { justify-content: center; }
    .hero-right { border-left: none; border-top: 1px solid var(--border); padding-left: 0; padding-top: 20px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .inventory-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="page-shell">
  <div class="back-nav">
    <a href="index.html" class="back-btn">← Volver al Marketplace</a>
  </div>

  <section class="hero-card" id="heroCard">
    <div class="loading-state">Cargando detalles del personaje...</div>
  </section>

  <section class="inventory-section" id="inventorySection">
    <div class="section-head">
      <div>
        <p class="section-kicker">Inventario</p>
        <h2 class="section-title">Ítems del personaje</h2>
      </div>

      <div class="filter-bar">
        <button class="filter-btn active" onclick="filtrarInventario('all', event)">Todos</button>
        <button class="filter-btn" onclick="filtrarInventario('tradeable', event)">Tradeables</button>
        <button class="filter-btn" onclick="filtrarInventario('bound', event)">Bindeados</button>
      </div>
    </div>

    <div class="inventory-grid" id="inventoryGrid">
      <div class="loading-state">Cargando ítems...</div>
    </div>
  </section>
</div>

<script>
const URL_API = "https://mir4-backend.onrender.com/api/nfts";
let currentNftData = null;

async function cargarDetalle() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if (!id) {
    document.getElementById('heroCard').innerHTML = `<div class="error-state">No se especificó ningún ID de personaje en la URL.</div>`;
    return;
  }

  try {
    const res = await fetch(URL_API);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const items = Array.isArray(data.items) ? data.items : [];
    
    currentNftData = items.find(n => String(n.id) === String(id));

    if (!currentNftData) {
      document.getElementById('heroCard').innerHTML = `<div class="error-state">No se encontró el personaje con ID: ${escapeHtml(id)}</div>`;
      document.getElementById('inventoryGrid').innerHTML = '';
      return;
    }

    renderizarDetalle(currentNftData);
  } catch (err) {
    console.error(err);
    document.getElementById('heroCard').innerHTML = `<div class="error-state">Error al conectar con el servidor. Intenta de nuevo en unos momentos.</div>`;
  }
}

function renderizarDetalle(nft) {
  const safeName = escapeHtml(nft.name || 'Sin nombre');
  const safeClass = escapeHtml(nft.class || 'Legendary');
  const safeServer = escapeHtml(nft.server || 'Asia 1');
  const safeImage = escapeHtml(nft.image || 'avatar.png');
  const safeUrl = escapeHtml(nft.url || '#');
  const safeId = escapeHtml(nft.id || '');

  const levelText = nft.level ?? '120';
  const powerText = nft.power ? Number(nft.power).toLocaleString('en-US') : '0';
  const priceWemix = nft.price_wemix !== undefined && nft.price_wemix !== null ? Number(nft.price_wemix).toLocaleString('en-US') : '0';
  const priceUsd = nft.price_wemix ? (nft.price_wemix * 0.67).toFixed(2) : '0.00'; // Estimación aproximada

  // Render Hero Card
  document.getElementById('heroCard').innerHTML = `
    <div class="hero-left">
      <div class="avatar-box">
        <img src="${safeImage}" alt="${safeName}" class="avatar-img" onerror="this.src='https://www.xdraco.com/nft/assets/img/common/thumb-default.png'">
        <span class="rarity-badge legendary">${safeClass}</span>
      </div>
    </div>

    <div class="hero-center">
      <p class="eyebrow">MIR4 NFT Detail</p>
      <h1 class="hero-title">${safeName}</h1>
      <p class="hero-subtitle">
        Inspección detallada del NFT con equipamiento, nivel y recursos oficiales de WEMIX PLAY.
      </p>

      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Level</span>
          <span class="stat-value">${levelText}</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Power</span>
          <span class="stat-value accent">${powerText}</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Server</span>
          <span class="stat-value">${safeServer}</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Status</span>
          <span class="stat-value">Listed</span>
        </div>
      </div>
    </div>

    <aside class="hero-right">
      <div class="price-box">
        <span class="price-label">Precio listado</span>
        <div class="price-value">${priceWemix} <small>WEMIX</small></div>
        <div class="price-usd">≈ $${priceUsd} USD</div>
      </div>

      <div class="action-row">
        <a href="${safeUrl}" target="_blank" rel="noopener" class="btn btn-primary">Ver en Marketplace</a>
        <button class="btn btn-secondary" onclick="copiarId('${safeId}')">Copiar ID</button>
      </div>
    </aside>
  `;

  renderizarInventarios(nft);
}

function renderizarInventarios(nft) {
  const equip = Array.isArray(nft.equipment) ? nft.equipment : [];
  const tradeables = equip.filter(e => e.tradeable);
  const bounds = equip.filter(e => !e.tradeable);

  const gridContainer = document.getElementById('inventoryGrid');

  gridContainer.innerHTML = `
    <!-- Tradeables -->
    <article class="inventory-panel tradeable-panel" data-type="tradeable">
      <div class="panel-head">
        <div>
          <h3 class="panel-title">Tradeables</h3>
          <p class="panel-subtitle">Ítems intercambiables</p>
        </div>
        <span class="count-badge">${tradeables.length}</span>
      </div>

      <div class="item-grid">
        ${tradeables.length ? tradeables.map(item => `
          <div class="item-card tradeable">
            <span class="item-state">TRADEABLE</span>
            <div class="item-icon">
              <img src="${escapeHtml(item.icon)}" alt="${escapeHtml(item.name)}" onerror="this.style.opacity=0">
            </div>
            <h4 class="item-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</h4>
            <p class="item-meta">Equipamiento</p>
          </div>
        `).join('') : '<div class="loading-state" style="grid-column: 1/-1; padding: 20px;">No hay ítems tradeables</div>'}
      </div>
    </article>

    <!-- Bindeados -->
    <article class="inventory-panel bound-panel" data-type="bound">
      <div class="panel-head">
        <div>
          <h3 class="panel-title">Bindeados</h3>
          <p class="panel-subtitle">Ítems no intercambiables</p>
        </div>
        <span class="count-badge muted">${bounds.length}</span>
      </div>

      <div class="item-grid">
        ${bounds.length ? bounds.map(item => `
          <div class="item-card bound">
            <span class="item-state bound-state">BOUND</span>
            <div class="item-icon">
              <img src="${escapeHtml(item.icon)}" alt="${escapeHtml(item.name)}" onerror="this.style.opacity=0">
            </div>
            <h4 class="item-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</h4>
            <p class="item-meta">Equipamiento</p>
          </div>
        `).join('') : '<div class="loading-state" style="grid-column: 1/-1; padding: 20px;">No hay ítems bindeados</div>'}
      </div>
    </article>
  `;
}

function filtrarInventario(tipo, event) {
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');

  const panels = document.querySelectorAll('.inventory-panel');
  panels.forEach(panel => {
    if (tipo === 'all') {
      panel.style.display = 'flex';
    } else {
      const panelType = panel.getAttribute('data-type');
      panel.style.display = panelType === tipo ? 'flex' : 'none';
    }
  });
}

function copiarId(id) {
  navigator.clipboard.writeText(id).then(() => {
    alert('¡ID del NFT copiado al portapapeles!');
  }).catch(err => {
    console.error('Error al copiar: ', err);
  });
}

function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

document.addEventListener('DOMContentLoaded', cargarDetalle);
</script>

</body>
</html>
