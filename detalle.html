<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspección de Inventario e Ítems Trade - MIR4</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0b0f19;
    --bg-card: #131b2e;
    --bg-slot: #090d16;
    --border-color: #22304a;
    --accent-blue: #3b82f6;
    --accent-gold: #f59e0b;
    --accent-cyan: #06b6d4;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background-color: var(--bg-main); 
    color: var(--text-main); 
    font-family: 'Outfit', sans-serif; 
    padding: 20px;
  }

  .wrapper { max-width: 1000px; margin: 0 auto; }

  nav {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    padding: 15px 25px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .back-btn {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-main);
    padding: 8px 16px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
    border: 1px solid var(--border-color);
    transition: all 0.2s;
  }
  .back-btn:hover { background: rgba(59, 130, 246, 0.1); border-color: var(--accent-blue); }

  .profile-header {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .profile-info h1 { font-size: 24px; color: #fff; margin-bottom: 5px; }
  .profile-meta { font-size: 14px; color: var(--text-muted); display: flex; gap: 15px; }

  .profile-price { text-align: right; }
  .profile-price .val { font-size: 26px; font-weight: 700; color: var(--accent-gold); }

  /* ESTILO DE INVENTARIO IDÉNTICO A HOFGAMER / XDRACO */
  .inventory-section {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 24px;
  }

  .section-title {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 10px;
  }

  .grid-slots {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
    gap: 10px;
  }

  .slot {
    background: var(--bg-slot);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    height: 105px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 8px;
    position: relative;
    transition: border-color 0.2s;
  }

  .slot:hover { border-color: var(--accent-blue); }

  /* Insignia "T" de Tradeable idéntica a la oficial */
  .trade-badge-t {
    position: absolute;
    top: 6px;
    left: 6px;
    background: #1e3a8a;
    color: #93c5fd;
    font-size: 10px;
    font-weight: 800;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    border: 1px solid #3b82f6;
  }

  .slot img {
    width: 42px;
    height: 42px;
    object-fit: contain;
    margin-top: 10px;
  }

  .slot-name {
    font-size: 10px;
    color: var(--text-muted);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }

  .slot-amount {
    font-size: 10px;
    color: var(--accent-cyan);
    font-weight: 700;
  }

  .loading { text-align: center; padding: 40px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="wrapper">
  <nav>
    <a href="index.html" class="back-btn">← Volver al Marketplace</a>
    <span style="font-size: 13px; color: var(--text-muted);">Inspección Interactiva de Cartera NFT</span>
  </nav>

  <div id="app-container">
    <div class="loading">Sincronizando datos de inventario y objetos trade...</div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const nftId = params.get('id');
  const URL_API = "https://mir4-backend.onrender.com/api/nfts";

  async function cargarInventarioNft() {
    const container = document.getElementById('app-container');

    try {
      const response = await fetch(URL_API);
      const data = await response.json();
      const nft = data.items.find(item => item.id == nftId || item.url.includes(nftId));

      if (!nft) {
        container.innerHTML = `<div class="loading" style="color: #ef4444;">No se encontró el personaje #${nftId} en el sistema.</div>`;
        return;
      }

      container.innerHTML = `
        <div class="profile-header">
          <div class="profile-info">
            <h1>${nft.name}</h1>
            <div class="profile-meta">
              <span>Clase: <strong style="color:#fff">${nft.class}</strong></span>
              <span>Nivel: <strong style="color:#fff">${nft.level}</strong></span>
              <span>Poder: <strong style="color:var(--accent-cyan)">${nft.power}</strong></span>
            </div>
          </div>
          <div class="profile-price">
            <div style="font-size:11px; color:var(--text-muted);">PRECIO DE VENTA</div>
            <div class="val">💎 ${nft.price}</div>
          </div>
        </div>

        <div class="inventory-section">
          <div class="section-title">
            <span>📦 Inventario y Almacén (Ítems Tradeables con Marca T)</span>
          </div>
          
          <div class="grid-slots">
            <!-- Slot 1: Objeto con marca T -->
            <div class="slot">
              <div class="trade-badge-t" title="Tradeable">T</div>
              <img src="https://www.xdraco.com/nft/assets/img/common/thumb-default.png" alt="Item">
              <div class="slot-name">Acero Oscuro</div>
              <div class="slot-amount">100,000</div>
            </div>

            <!-- Slot 2: Objeto con marca T -->
            <div class="slot">
              <div class="trade-badge-t" title="Tradeable">T</div>
              <img src="https://www.xdraco.com/nft/assets/img/common/thumb-default.png" alt="Item">
              <div class="slot-name">Piedra Mágica</div>
              <div class="slot-amount">+3 Raro</div>
            </div>

            <!-- Slot 3: Objeto con marca T -->
            <div class="slot">
              <div class="trade-badge-t" title="Tradeable">T</div>
              <div style="position: absolute; top:6px; right:6px; font-size:9px; background:rgba(255,255,255,0.05); padding:1px 4px; border-radius:3px;">Sellado</div>
              <img src="https://www.xdraco.com/nft/assets/img/common/thumb-default.png" alt="Item">
              <div class="slot-name">Energía</div>
              <div class="slot-amount">50 U.</div>
            </div>

            <!-- Slot 4: Espacio vacío de inventario -->
            <div class="slot" style="opacity: 0.3; justify-content: center;">
              <span style="font-size: 11px; color: var(--text-muted);">Vacío</span>
            </div>
            
            <!-- Slot 5: Espacio vacío de inventario -->
            <div class="slot" style="opacity: 0.3; justify-content: center;">
              <span style="font-size: 11px; color: var(--text-muted);">Vacío</span>
            </div>
          </div>
          
          <div style="margin-top: 20px; text-align: right;">
            <a href="${nft.url}" target="_blank" style="background: var(--accent-blue); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 600;">Ver Registro Completo en XDRACO ↗</a>
          </div>
        </div>
      `;
    } catch (err) {
      console.error(err);
      container.innerHTML = `<div class="loading" style="color: #ef4444;">Error al cargar los datos del servidor.</div>`;
    }
  }

  cargarInventarioNft();
</script>

</body>
</html>
