<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspección de Ítems Trade & Personaje - MIR4 Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #07090e;
    --bg-card: #121620;
    --border-color: #212838;
    --accent-blue: #3b82f6;
    --accent-gold: #f59e0b;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background-color: var(--bg-main); 
    color: var(--text-main); 
    font-family: 'Outfit', sans-serif; 
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  nav {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-color);
    padding: 12px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 65px;
  }

  .back-btn {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-main);
    padding: 8px 16px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--border-color);
    transition: all 0.2s;
  }

  .back-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: var(--accent-blue);
  }

  .nav-title {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  h2 { font-size: 16px; font-weight: 600; color: #fff; }
  span.subtitle { font-size: 12px; color: var(--accent-gold); }

  .visor-container {
    flex-grow: 1;
    width: 100%;
    background: #0b0f19;
    position: relative;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #07090e;
  }

  .loading-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--bg-main);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
    z-index: 10;
    transition: opacity 0.3s ease;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(59, 130, 246, 0.2);
    border-top-color: var(--accent-blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    font-size: 14px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="back-btn">← Volver al Marketplace</a>
  <div class="nav-title">
    <h2>Portal de Inspección MIR4</h2>
    <span class="subtitle">📦 Visualización de Ítems Trade & Estadísticas</span>
  </div>
</nav>

<div class="visor-container" id="visor">
  <div id="loader" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Cargando ficha completa e ítems Trade del personaje...</div>
  </div>
  <iframe id="nft-iframe" src="" onload="ocultarLoader()"></iframe>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const targetUrl = params.get('url');
  const nftId = params.get('id');

  const iframe = document.getElementById('nft-iframe');

  if (targetUrl) {
    // Decodifica la URL original de HofGamer/XDRACO para cargarla dentro de tu propia página online
    iframe.src = decodeURIComponent(targetUrl);
  } else {
    document.getElementById('loader').innerHTML = "<p style='color: #ef4444;'>No se encontró el enlace del personaje.</p>";
  }

  function ocultarLoader() {
    const loader = document.getElementById('loader');
    if (loader) {
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display = 'none', 300);
    }
  }
</script>

</body>
</html>
