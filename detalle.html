<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle NFT - MIR4</title>
  <meta name="description" content="Inspección detallada de NFT MIR4 con aspecto premium inspirado en marketplaces gaming." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#070a11;
      --bg-2:#0c101a;
      --panel:#101625cc;
      --panel-solid:#101625;
      --panel-2:#0d1320;
      --line:#20293c;
      --line-soft:rgba(255,255,255,.08);
      --text:#f4f7fb;
      --muted:#9aa6bf;
      --muted-2:#72809e;
      --gold:#d3a85d;
      --gold-2:#f5d08a;
      --cyan:#67d6ff;
      --blue:#4a78ff;
      --emerald:#1fda94;
      --danger:#ff6b79;
      --shadow:0 24px 70px rgba(0,0,0,.45);
      --legendary:#f0b44f;
      --epic:#a95cff;
      --rare:#59a5ff;
      --common:#79849a;
      --radius-xl:24px;
      --radius-lg:18px;
      --radius-md:14px;
      --radius-sm:10px;
      --content:1320px;
      --header-h:72px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--text);
      font-family:"Inter",sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(73,120,255,.16), transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(211,168,93,.12), transparent 24%),
        radial-gradient(circle at 50% 70%, rgba(103,214,255,.08), transparent 32%),
        linear-gradient(180deg, #070a11 0%, #090d15 40%, #06080d 100%);
      min-height:100vh;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.22;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size:40px 40px;
      mask-image:radial-gradient(circle at center, black 45%, transparent 95%);
    }

    img{max-width:100%;display:block}
    button,input{font:inherit}
    a{color:inherit}

    .page-shell{
      width:min(calc(100% - 28px), var(--content));
      margin-inline:auto;
      padding:18px 0 48px;
      position:relative;
      z-index:1;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:30;
      backdrop-filter:blur(16px);
      background:linear-gradient(180deg, rgba(7,10,17,.82), rgba(7,10,17,.42));
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    .topbar-inner{
      width:min(calc(100% - 28px), var(--content));
      margin-inline:auto;
      min-height:var(--header-h);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
    }

    .brand-mark{
      width:42px;height:42px;border-radius:12px;
      background:
        linear-gradient(135deg, rgba(240,180,79,.22), rgba(74,120,255,.18)),
        #12192a;
      border:1px solid rgba(255,255,255,.08);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 12px 35px rgba(0,0,0,.35);
      position:relative;
      overflow:hidden;
    }
    .brand-mark::before,
    .brand-mark::after{
      content:"";
      position:absolute;
      inset:9px;
      border:1px solid rgba(255,255,255,.14);
      transform:skew(-14deg);
    }
    .brand-mark::after{
      inset:14px 8px 14px 18px;
      background:linear-gradient(135deg, rgba(240,180,79,.45), rgba(103,214,255,.15));
      border:none;
    }

    .brand-copy{
      display:flex;
      flex-direction:column;
      min-width:0;
    }

    .eyebrow{
      color:var(--gold-2);
      text-transform:uppercase;
      letter-spacing:.18em;
      font-size:.7rem;
      font-weight:700;
      line-height:1;
      margin-bottom:6px;
    }

    .brand-title{
      font-family:"Orbitron",sans-serif;
      font-size:clamp(1rem, 1.8vw, 1.25rem);
      font-weight:800;
      letter-spacing:.06em;
      white-space:nowrap;
    }

    .top-actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .ghost-link,
    .primary-link{
      min-height:44px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:0 16px;
      text-decoration:none;
      border:1px solid var(--line-soft);
      transition:transform .2s ease, border-color .2s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
      will-change:transform;
    }

    .ghost-link{
      color:var(--muted);
      background:rgba(255,255,255,.02);
    }
    .ghost-link:hover{
      color:var(--text);
      border-color:rgba(255,255,255,.16);
      transform:translateY(-1px);
      background:rgba(255,255,255,.04);
    }

    .primary-link{
      color:#111;
      font-weight:800;
      background:linear-gradient(135deg, var(--gold-2), var(--gold));
      border-color:transparent;
      box-shadow:0 12px 30px rgba(211,168,93,.22);
    }
    .primary-link:hover{
      transform:translateY(-2px) scale(1.01);
      box-shadow:0 18px 36px rgba(211,168,93,.28);
    }
    .primary-link:active,
    .ghost-link:active,
    .tab-btn:active,
    .pill:active{
      transform:scale(.98);
    }

    .hero{
      position:relative;
      margin-top:22px;
      border:1px solid var(--line-soft);
      border-radius:30px;
      overflow:hidden;
      background:
        linear-gradient(145deg, rgba(16,22,37,.92), rgba(11,15,24,.96)),
        var(--panel-solid);
      box-shadow:var(--shadow);
    }

    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 12% 18%, rgba(240,180,79,.14), transparent 25%),
        radial-gradient(circle at 82% 18%, rgba(73,120,255,.16), transparent 25%),
        linear-gradient(115deg, transparent 0 30%, rgba(255,255,255,.03) 30% 31%, transparent 31% 100%);
      pointer-events:none;
    }

    .hero-grid{
      position:relative;
      display:grid;
      grid-template-columns: 320px minmax(0,1fr);
      gap:0;
    }

    .hero-visual{
      min-height:420px;
      border-right:1px solid var(--line-soft);
      background:
        radial-gradient(circle at 50% 28%, rgba(103,214,255,.12), transparent 26%),
        radial-gradient(circle at 50% 75%, rgba(240,180,79,.13), transparent 28%),
        linear-gradient(180deg, rgba(255,255,255,.02), transparent 50%),
        #0c111d;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      padding:28px;
    }

    .hero-visual::before{
      content:"";
      position:absolute;
      inset:18px;
      border-radius:24px;
      border:1px solid rgba(255,255,255,.05);
      pointer-events:none;
    }

    .avatar-stage{
      width:min(100%, 250px);
      aspect-ratio: 1 / 1.08;
      border-radius:26px;
      position:relative;
      padding:14px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.01)),
        linear-gradient(145deg, rgba(240,180,79,.08), rgba(74,120,255,.08)),
        #121929;
      border:1px solid rgba(255,255,255,.09);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 20px 50px rgba(0,0,0,.42);
      isolation:isolate;
    }

    .avatar-stage::before{
      content:"";
      position:absolute;
      inset:-1px;
      border-radius:26px;
      padding:1px;
      background:linear-gradient(135deg, rgba(240,180,79,.7), rgba(103,214,255,.18), rgba(255,255,255,.05));
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
      opacity:.8;
      pointer-events:none;
    }

    .avatar-frame{
      width:100%;
      height:100%;
      border-radius:20px;
      overflow:hidden;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 50% 30%, rgba(255,255,255,.08), transparent 30%),
        linear-gradient(180deg, rgba(240,180,79,.06), rgba(74,120,255,.04)),
        #0a0f18;
    }

    .avatar-frame img{
      width:100%;
      height:100%;
      object-fit:contain;
      filter:drop-shadow(0 18px 36px rgba(0,0,0,.45));
    }

    .avatar-fallback{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Orbitron",sans-serif;
      font-size:clamp(2rem,5vw,3.5rem);
      color:rgba(255,255,255,.72);
      background:
        radial-gradient(circle at 50% 35%, rgba(103,214,255,.16), transparent 22%),
        radial-gradient(circle at 50% 70%, rgba(240,180,79,.14), transparent 26%);
    }

    .rarity-ring{
      position:absolute;
      inset:auto 16px 16px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      z-index:2;
    }

    .rarity-chip,
    .id-chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-height:34px;
      padding:0 12px;
      border-radius:999px;
      font-size:.76rem;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.1);
      background:rgba(7,10,17,.6);
    }

    .rarity-chip::before{
      content:"";
      width:8px;height:8px;border-radius:50%;
      background:currentColor;
      box-shadow:0 0 12px currentColor;
    }

    .hero-copy{
      padding:28px;
      display:grid;
      grid-template-rows:auto auto 1fr auto;
      gap:22px;
      min-width:0;
    }

    .hero-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
      flex-wrap:wrap;
    }

    .hero-title-wrap{
      min-width:0;
    }

    .hero-kicker{
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.18em;
      font-size:.72rem;
      font-weight:800;
      margin-bottom:10px;
    }

    .hero-title{
      margin:0;
      font-family:"Orbitron",sans-serif;
      font-size:clamp(2rem, 5vw, 3.35rem);
      line-height:.96;
      letter-spacing:.02em;
      text-transform:uppercase;
      max-width:14ch;
      text-wrap:balance;
    }

    .hero-sub{
      margin-top:14px;
      color:#c1cadb;
      max-width:70ch;
      line-height:1.65;
      font-size:clamp(.96rem, 1.6vw, 1.06rem);
    }

    .price-panel{
      min-width:min(100%, 280px);
      border-radius:22px;
      padding:18px 18px 16px;
      background:
        linear-gradient(180deg, rgba(240,180,79,.1), rgba(255,255,255,.02)),
        rgba(255,255,255,.02);
      border:1px solid rgba(240,180,79,.18);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    }

    .price-label{
      color:var(--muted);
      font-size:.76rem;
      letter-spacing:.14em;
      text-transform:uppercase;
      font-weight:800;
      margin-bottom:8px;
    }

    .price-main{
      display:flex;
      align-items:baseline;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:6px;
    }

    .price-value{
      font-family:"Orbitron",sans-serif;
      font-weight:800;
      font-size:clamp(1.45rem, 3vw, 2.25rem);
      color:var(--gold-2);
      line-height:1;
    }

    .price-unit{
      color:#f7e1b9;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
      font-size:.84rem;
    }

    .price-usd{
      color:var(--muted);
      font-size:.94rem;
    }

    .hero-stats{
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:14px;
    }

    .stat{
      position:relative;
      border:1px solid var(--line-soft);
      background:
        linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,.01)),
        rgba(255,255,255,.015);
      border-radius:18px;
      padding:16px;
      overflow:hidden;
      min-height:92px;
    }

    .stat::after{
      content:"";
      position:absolute;
      inset:auto 0 0 0;
      height:2px;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
      opacity:.4;
    }

    .stat-label{
      color:var(--muted);
      font-size:.74rem;
      text-transform:uppercase;
      letter-spacing:.16em;
      font-weight:800;
      margin-bottom:10px;
    }

    .stat-value{
      font-size:clamp(1.12rem, 2vw, 1.5rem);
      font-weight:800;
      color:var(--text);
      line-height:1.1;
      overflow-wrap:anywhere;
    }

    .stat-value.highlight{color:var(--cyan)}
    .stat-value.gold{color:var(--gold-2)}

    .hero-foot{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
      padding-top:4px;
    }

    .pill-row{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .pill{
      min-height:40px;
      padding:0 14px;
      border-radius:999px;
      border:1px solid var(--line-soft);
      background:rgba(255,255,255,.025);
      color:var(--text);
      display:inline-flex;
      align-items:center;
      gap:10px;
      font-weight:700;
      transition:transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .pill:hover{
      transform:translateY(-1px);
      border-color:rgba(255,255,255,.16);
      background:rgba(255,255,255,.04);
    }
    .pill small{
      color:var(--muted);
      font-weight:600;
    }

    .section-wrap{
      margin-top:22px;
      display:grid;
      grid-template-columns:minmax(0,1fr);
      gap:22px;
    }

    .tabs-shell{
      border-radius:24px;
      overflow:hidden;
      border:1px solid var(--line-soft);
      background:
        linear-gradient(180deg, rgba(16,22,37,.88), rgba(10,14,22,.96));
      box-shadow:var(--shadow);
    }

    .tabs-header{
      display:flex;
      gap:10px;
      padding:16px;
      overflow:auto hidden;
      border-bottom:1px solid var(--line-soft);
      scrollbar-width:thin;
      background:linear-gradient(180deg, rgba(255,255,255,.02), transparent);
    }

    .tab-btn{
      appearance:none;
      border:none;
      cursor:pointer;
      position:relative;
      white-space:nowrap;
      min-height:48px;
      padding:0 18px;
      border-radius:999px;
      font-weight:800;
      letter-spacing:.04em;
      color:var(--muted);
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.06);
      transition:
        transform .2s ease,
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
    }

    .tab-btn:hover{
      color:var(--text);
      border-color:rgba(255,255,255,.14);
      transform:translateY(-1px);
    }

    .tab-btn.active{
      color:#0b0d12;
      background:linear-gradient(135deg, var(--gold-2), var(--gold));
      border-color:transparent;
      box-shadow:0 10px 28px rgba(211,168,93,.2);
    }

    .panel{
      display:none;
      padding:22px;
    }

    .panel.active{
      display:block;
      animation:panelIn .35s ease both;
    }

    @keyframes panelIn{
      from{opacity:0; transform:translateY(10px)}
      to{opacity:1; transform:translateY(0)}
    }

    .panel-intro{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
      margin-bottom:22px;
      flex-wrap:wrap;
    }

    .panel-title{
      margin:0;
      font-family:"Orbitron",sans-serif;
      font-size:clamp(1.1rem, 2vw, 1.45rem);
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    .panel-desc{
      margin-top:8px;
      color:var(--muted);
      max-width:75ch;
      line-height:1.6;
      font-size:.95rem;
    }

    .panel-count{
      min-height:42px;
      padding:0 14px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      border:1px solid rgba(255,255,255,.09);
      color:var(--gold-2);
      font-weight:800;
      background:rgba(255,255,255,.025);
    }

    .item-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(165px, 1fr));
      gap:16px;
    }

    .item{
      position:relative;
      min-height:238px;
      border-radius:20px;
      overflow:hidden;
      padding:14px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015)),
        #0d1320;
      border:1px solid rgba(255,255,255,.08);
      transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:12px;
    }

    .item:hover{
      transform:translateY(-4px);
      border-color:rgba(255,255,255,.16);
      box-shadow:0 18px 34px rgba(0,0,0,.28);
    }

    .item::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.045), transparent 35%),
        radial-gradient(circle at top right, rgba(255,255,255,.08), transparent 30%);
      pointer-events:none;
    }

    .item.legendary{
      border-color:rgba(240,180,79,.38);
      background:
        linear-gradient(180deg, rgba(240,180,79,.09), rgba(255,255,255,.015)),
        #0d1320;
    }
    .item.epic{
      border-color:rgba(169,92,255,.38);
      background:
        linear-gradient(180deg, rgba(169,92,255,.1), rgba(255,255,255,.015)),
        #0d1320;
    }
    .item.rare{
      border-color:rgba(89,165,255,.38);
      background:
        linear-gradient(180deg, rgba(89,165,255,.09), rgba(255,255,255,.015)),
        #0d1320;
    }

    .item-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      position:relative;
      z-index:1;
    }

    .grade{
      max-width:70%;
      min-height:28px;
      padding:0 10px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      font-size:.68rem;
      letter-spacing:.12em;
      text-transform:uppercase;
      font-weight:800;
      color:#d8dfef;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .trade-badge{
      width:30px;height:30px;border-radius:50%;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:.72rem;
      font-weight:900;
      color:#04150f;
      background:linear-gradient(135deg, #40f2b2, #17ba7d);
      box-shadow:0 0 0 4px rgba(31,218,148,.1);
      flex:0 0 auto;
    }

    .item-art{
      position:relative;
      z-index:1;
      min-height:100px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:8px;
    }

    .thumb-shell{
      width:96px;height:96px;
      border-radius:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 50% 30%, rgba(255,255,255,.08), transparent 34%),
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02)),
        #121a2a;
      border:1px solid rgba(255,255,255,.08);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
      overflow:hidden;
    }

    .thumb-shell img{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    .thumb-fallback{
      width:100%;height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1.7rem;
      color:rgba(255,255,255,.55);
      font-family:"Orbitron",sans-serif;
    }

    .item-meta{
      position:relative;
      z-index:1;
      display:flex;
      flex-direction:column;
      gap:8px;
      align-self:end;
    }

    .item-name{
      font-size:.92rem;
      font-weight:800;
      line-height:1.34;
      color:var(--text);
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
      min-height:2.5em;
    }

    .item-sub{
      color:var(--muted);
      font-size:.82rem;
      line-height:1.4;
      min-height:1.4em;
    }

    .item-power{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:2px;
    }

    .item-power span{
      min-height:28px;
      padding:0 10px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      font-size:.76rem;
      font-weight:800;
      color:#f8e3bc;
      background:rgba(211,168,93,.12);
      border:1px solid rgba(211,168,93,.18);
    }

    .empty{
      min-height:280px;
      display:grid;
      place-items:center;
      border:1px dashed rgba(255,255,255,.12);
      border-radius:22px;
      text-align:center;
      color:var(--muted);
      padding:28px;
      background:rgba(255,255,255,.015);
    }

    .empty strong{
      display:block;
      color:var(--text);
      margin-bottom:8px;
      font-size:1.08rem;
    }

    .loading-view,
    .error-view{
      min-height:60vh;
      display:grid;
      place-items:center;
    }

    .state-box{
      width:min(100%, 760px);
      border-radius:28px;
      padding:32px;
      border:1px solid var(--line-soft);
      background:
        linear-gradient(180deg, rgba(16,22,37,.92), rgba(10,14,22,.96));
      box-shadow:var(--shadow);
      text-align:center;
    }

    .state-mark{
      width:84px;height:84px;margin:0 auto 18px;
      border-radius:24px;
      display:grid;place-items:center;
      font-family:"Orbitron",sans-serif;
      font-size:1.6rem;
      color:var(--gold-2);
      background:
        radial-gradient(circle at 50% 30%, rgba(240,180,79,.18), transparent 35%),
        #131a2b;
      border:1px solid rgba(240,180,79,.18);
    }

    .state-title{
      margin:0 0 10px;
      font-family:"Orbitron",sans-serif;
      text-transform:uppercase;
      letter-spacing:.05em;
      font-size:clamp(1.3rem,3vw,2rem);
    }

    .state-text{
      color:var(--muted);
      line-height:1.7;
      margin:0 auto 22px;
      max-width:58ch;
    }

    .spinner{
      width:20px;height:20px;border-radius:50%;
      border:2px solid rgba(255,255,255,.16);
      border-top-color:var(--gold-2);
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    .reveal{
      opacity:0;
      transform:translateY(18px);
      transition:opacity .6s ease, transform .6s ease;
    }
    .reveal.is-visible{
      opacity:1;
      transform:translateY(0);
    }

    .stagger > *{
      opacity:0;
      transform:translateY(14px);
      animation:rise .55s ease forwards;
    }
    .stagger > *:nth-child(1){animation-delay:.04s}
    .stagger > *:nth-child(2){animation-delay:.1s}
    .stagger > *:nth-child(3){animation-delay:.16s}
    .stagger > *:nth-child(4){animation-delay:.22s}
    .stagger > *:nth-child(5){animation-delay:.28s}
    .stagger > *:nth-child(6){animation-delay:.34s}
    .stagger > *:nth-child(7){animation-delay:.4s}
    .stagger > *:nth-child(8){animation-delay:.46s}

    @keyframes rise{
      to{opacity:1; transform:translateY(0)}
    }

    .legendary-text{color:var(--legendary)}
    .epic-text{color:var(--epic)}
    .rare-text{color:var(--rare)}
    .common-text{color:#c0cadb}

    @media (max-width: 1100px){
      .hero-grid{grid-template-columns:280px minmax(0,1fr)}
      .hero-stats{grid-template-columns:repeat(2, minmax(0,1fr))}
    }

    @media (max-width: 820px){
      .topbar-inner{padding:10px 0}
      .hero-grid{grid-template-columns:1fr}
      .hero-visual{
        min-height:unset;
        border-right:none;
        border-bottom:1px solid var(--line-soft);
        padding:24px;
      }
      .avatar-stage{max-width:240px}
      .hero-copy{padding:22px}
      .hero-head{flex-direction:column}
      .price-panel{width:100%}
    }

    @media (max-width: 640px){
      .page-shell{width:min(calc(100% - 18px), var(--content)); padding-top:12px}
      .topbar-inner{width:min(calc(100% - 18px), var(--content))}
      .brand-copy .eyebrow{display:none}
      .top-actions .ghost-link span{display:none}
      .top-actions .ghost-link{padding:0 13px}
      .hero{border-radius:24px}
      .hero-title{max-width:none}
      .hero-stats{grid-template-columns:1fr 1fr}
      .panel{padding:16px}
      .tabs-header{padding:12px}
      .item-grid{grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}
      .item{min-height:216px;padding:12px}
      .thumb-shell{width:84px;height:84px}
      .panel-intro{margin-bottom:18px}
    }

    @media (max-width: 430px){
      .hero-stats{grid-template-columns:1fr}
      .item-grid{grid-template-columns:1fr 1fr}
      .hero-copy{padding:18px}
      .hero-visual{padding:18px}
    }

    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{
        animation:none !important;
        transition:none !important;
        scroll-behavior:auto !important;
      }
      .reveal{opacity:1; transform:none}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-copy">
          <span class="eyebrow">Marketplace Inspection</span>
          <strong class="brand-title">MIR4 NFT Detail</strong>
        </div>
      </div>
      <div class="top-actions">
        <a class="ghost-link" href="index.html" aria-label="Volver al mercado">
          <span>←</span>
          <span>Volver al mercado</span>
        </a>
        <a class="primary-link" id="xdracoLink" href="#" target="_blank" rel="noopener noreferrer">
          Ver en XDRACO
        </a>
      </div>
    </div>
  </header>

  <main class="page-shell" id="app">
    <section class="loading-view">
      <div class="state-box reveal is-visible">
        <div class="state-mark"><div class="spinner" aria-hidden="true"></div></div>
        <h1 class="state-title">Cargando inspección</h1>
        <p class="state-text">Estamos recuperando la ficha del personaje, su equipamiento y sus recursos para construir una vista más limpia, sólida y premium.</p>
        <div class="pill-row" style="justify-content:center">
          <div class="pill"><small>ID</small><span id="loadingNftId">—</span></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const nftId = params.get('id');
    const URL_API = "https://mir4-backend.onrender.com/api/nfts";
    const DEFAULT_IMG = "data:image/svg+xml;utf8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f0b44f"/>
            <stop offset="1" stop-color="#4a78ff"/>
          </linearGradient>
        </defs>
        <rect width="240" height="240" rx="36" fill="#0d1320"/>
        <rect x="18" y="18" width="204" height="204" rx="28" fill="none" stroke="rgba(255,255,255,.12)"/>
        <circle cx="120" cy="86" r="34" fill="url(#g)" opacity=".9"/>
        <path d="M60 184c14-31 42-46 60-46s46 15 60 46" fill="none" stroke="url(#g)" stroke-width="22" stroke-linecap="round"/>
      </svg>
    `);

    document.getElementById("loadingNftId").textContent = nftId || "—";

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatNumber(value, fallback = "—") {
      const num = Number(value);
      return Number.isFinite(num) ? num.toLocaleString("es-ES") : fallback;
    }

    function formatDecimal(value, fallback = "—", max = 4) {
      const num = Number(value);
      return Number.isFinite(num)
        ? num.toLocaleString("es-ES", { minimumFractionDigits: 0, maximumFractionDigits: max })
        : fallback;
    }

    function getRarityInfo(rarity) {
      const r = String(rarity || "").toLowerCase();
      if (r.includes("legend")) return { cls: "legendary", label: "Legendary", textCls: "legendary-text" };
      if (r.includes("epic")) return { cls: "epic", label: "Epic", textCls: "epic-text" };
      if (r.includes("rare")) return { cls: "rare", label: "Rare", textCls: "rare-text" };
      return { cls: "", label: rarity || "Common", textCls: "common-text" };
    }

    function safeArray(...sources) {
      for (const source of sources) {
        if (Array.isArray(source) && source.length) return source;
      }
      return [];
    }

    function getTabMeta(key) {
      const map = {
        equipment: {
          title: "Equipment",
          desc: "Piezas equipadas del personaje. Vista enfocada en nombre, rareza y nivel de mejora.",
          empty: "No hay equipamiento disponible."
        },
        trade: {
          title: "Trade Items",
          desc: "Objetos intercambiables o recursos vinculados al inventario que pueden tener salida comercial.",
          empty: "No hay ítems tradeables disponibles."
        },
        spirit: {
          title: "Spirit",
          desc: "Espíritus asociados al NFT, útiles para evaluar valor y configuración del personaje.",
          empty: "No hay espíritus disponibles."
        },
        magic: {
          title: "Magic Stone",
          desc: "Piedras mágicas, orbes u objetos similares que completan la build del personaje.",
          empty: "No hay piedras mágicas disponibles."
        },
        skills: {
          title: "Skills",
          desc: "Habilidades detectadas en la ficha del NFT con sus respectivos niveles o rangos.",
          empty: "No hay habilidades disponibles."
        }
      };
      return map[key];
    }

    function initialsFromName(name) {
      const parts = String(name || "NFT").trim().split(/\s+/).slice(0, 2);
      return parts.map(p => p.charAt(0).toUpperCase()).join("") || "NF";
    }

    function createThumb(img, alt, initials = "IT") {
      const src = escapeHtml(img || DEFAULT_IMG);
      const safeAlt = escapeHtml(alt || "Imagen");
      return `
        <div class="thumb-shell">
          <img src="${src}" alt="${safeAlt}" loading="lazy"
            onerror="this.replaceWith((()=>{const d=document.createElement('div');d.className='thumb-fallback';d.textContent='${escapeHtml(initials)}';return d;})())">
        </div>
      `;
    }

    function createAvatar(img, name) {
      const src = escapeHtml(img || DEFAULT_IMG);
      const safeName = escapeHtml(name || "NFT");
      const initials = escapeHtml(initialsFromName(name));
      return `
        <div class="avatar-frame">
          <img src="${src}" alt="${safeName}" loading="eager"
            onerror="this.replaceWith((()=>{const d=document.createElement('div');d.className='avatar-fallback';d.textContent='${initials}';return d;})())">
        </div>
      `;
    }

    function renderEmpty(text) {
      return `
        <div class="empty">
          <div>
            <strong>Sin datos en esta sección</strong>
            <div>${escapeHtml(text)}</div>
          </div>
        </div>
      `;
    }

    function renderItemsGrid(items, emptyText = "No hay elementos disponibles.") {
      if (!Array.isArray(items) || items.length === 0) return renderEmpty(emptyText);

      return `
        <div class="item-grid stagger">
          ${items.map(item => {
            const name = escapeHtml(item?.name || item?.title || item?.skill_name || "Sin nombre");
            const rarityRaw = item?.rarity || item?.grade || item?.rank || item?.tier || "Common";
            const rarity = getRarityInfo(rarityRaw);
            const image = item?.image || item?.icon || item?.thumbnail || DEFAULT_IMG;
            const tradeable = !!(item?.tradeable || item?.is_tradeable || item?.trade);
            const enhance = item?.enhance ?? item?.refine ?? item?.level ?? item?.lv ?? "";
            const amount = item?.amount ?? item?.count ?? item?.qty ?? "";
            const part = item?.slot || item?.type || item?.category || "";
            const chips = [];

            if (enhance !== "" && enhance !== null && enhance !== undefined) {
              chips.push(`<span>+${escapeHtml(String(enhance))}</span>`);
            } else if (amount !== "" && amount !== null && amount !== undefined) {
              chips.push(`<span>x${escapeHtml(formatNumber(amount, String(amount)))}</span>`);
            }

            if (part) {
              chips.push(`<span>${escapeHtml(String(part))}</span>`);
            }

            return `
              <article class="item ${rarity.cls}" aria-label="${name}">
                <div class="item-top">
                  <div class="grade ${rarity.textCls}" title="${escapeHtml(String(rarityRaw))}">${escapeHtml(String(rarityRaw))}</div>
                  ${tradeable ? `<div class="trade-badge" title="Intercambiable">T</div>` : ``}
                </div>

                <div class="item-art">
                  ${createThumb(image, name, initialsFromName(name))}
                </div>

                <div class="item-meta">
                  <div class="item-name" title="${name}">${name}</div>
                  <div class="item-sub">${part ? escapeHtml(String(part)) : "&nbsp;"}</div>
                  <div class="item-power">${chips.join("")}</div>
                </div>
              </article>
            `;
          }).join("")}
        </div>
      `;
    }

    function setActiveTab(id) {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        const active = btn.dataset.tab === id;
        btn.classList.toggle("active", active);
        btn.setAttribute("aria-selected", active ? "true" : "false");
      });
      document.querySelectorAll(".panel").forEach(panel => {
        panel.classList.toggle("active", panel.id === id);
      });
    }

    function mountTabEvents() {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => setActiveTab(btn.dataset.tab));
      });
    }

    function setupReveal() {
      const nodes = document.querySelectorAll(".reveal");
      if (!("IntersectionObserver" in window)) {
        nodes.forEach(el => el.classList.add("is-visible"));
        return;
      }
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });
      nodes.forEach(el => io.observe(el));
    }

    function renderError(message, tone = "Error de carga") {
      const app = document.getElementById("app");
      app.innerHTML = `
        <section class="error-view">
          <div class="state-box reveal is-visible">
            <div class="state-mark" style="color:var(--danger);border-color:rgba(255,107,121,.18)">!</div>
            <h1 class="state-title">${escapeHtml(tone)}</h1>
            <p class="state-text">${escapeHtml(message)}</p>
            <div class="pill-row" style="justify-content:center">
              <a class="ghost-link" href="index.html">← Volver al mercado</a>
            </div>
          </div>
        </section>
      `;
    }

    function buildDetail(nft) {
      const app = document.getElementById("app");

      const name = nft?.name || "Sin nombre";
      const image = nft?.image || nft?.thumbnail || DEFAULT_IMG;
      const server = nft?.server || nft?.world || "N/A";
      const level = formatNumber(nft?.level, "—");
      const power = formatNumber(nft?.power || nft?.power_score, "—");
      const wemix = formatDecimal(nft?.price_wemix ?? nft?.price, "0");
      const usdNum = Number(nft?.price_usd);
      const usdText = Number.isFinite(usdNum)
        ? `≈ $${usdNum.toLocaleString("es-ES", { maximumFractionDigits: 2 })} USD`
        : "Valor USD no disponible";
      const rarityRaw = nft?.rarity || nft?.rank || nft?.grade || "Common";
      const rarity = getRarityInfo(rarityRaw);

      const equipment = safeArray(nft?.equipment, nft?.equipped_gear, nft?.gear);
      const trade = safeArray(nft?.trade_items, nft?.tradeables, nft?.inventory_trade);
      const spirit = safeArray(nft?.spirits, nft?.spirit, nft?.summons);
      const magic = safeArray(nft?.magic_stones, nft?.magic, nft?.orbs);
      const skills = safeArray(nft?.skills, nft?.abilities);

      const sections = [
        { id: "equipment", icon: "⚔", items: equipment },
        { id: "trade", icon: "◈", items: trade },
        { id: "spirit", icon: "✦", items: spirit },
        { id: "magic", icon: "◆", items: magic },
        { id: "skills", icon: "✧", items: skills }
      ];

      const xdracoHref = `https://www.xdraco.com/nft/trade/${encodeURIComponent(nft?.id || nftId || "")}`;
      const xdracoLink = document.getElementById("xdracoLink");
      if (xdracoLink) xdracoLink.href = xdracoHref;

      app.innerHTML = `
        <section class="hero reveal">
          <div class="hero-grid">
            <div class="hero-visual">
              <div class="avatar-stage ${rarity.cls}">
                ${createAvatar(image, name)}
                <div class="rarity-ring">
                  <div class="rarity-chip ${rarity.textCls}">${escapeHtml(rarity.label)}</div>
                  <div class="id-chip">#${escapeHtml(String(nft?.id ?? nftId ?? "—"))}</div>
                </div>
              </div>
            </div>

            <div class="hero-copy">
              <div class="hero-head">
                <div class="hero-title-wrap">
                  <div class="hero-kicker">MIR4 Character Inspection</div>
                  <h1 class="hero-title">${escapeHtml(name)}</h1>
                  <p class="hero-sub">
                    Vista refinada del NFT con una composición más cercana al lenguaje visual de marketplaces premium:
                    foco en jerarquía, mejor lectura, rareza más clara y una navegación limpia por inventario.
                  </p>
                </div>

                <aside class="price-panel" aria-label="Precio del NFT">
                  <div class="price-label">Precio listado</div>
                  <div class="price-main">
                    <div class="price-value">${escapeHtml(wemix)}</div>
                    <div class="price-unit">WEMIX</div>
                  </div>
                  <div class="price-usd">${escapeHtml(usdText)}</div>
                </aside>
              </div>

              <div class="hero-stats stagger">
                <div class="stat">
                  <div class="stat-label">Nivel</div>
                  <div class="stat-value highlight">${escapeHtml(level)}</div>
                </div>
                <div class="stat">
                  <div class="stat-label">Power Score</div>
                  <div class="stat-value gold">${escapeHtml(power)}</div>
                </div>
                <div class="stat">
                  <div class="stat-label">Servidor</div>
                  <div class="stat-value">${escapeHtml(server)}</div>
                </div>
                <div class="stat">
                  <div class="stat-label">Rareza</div>
                  <div class="stat-value ${rarity.textCls}">${escapeHtml(String(rarityRaw))}</div>
                </div>
              </div>

              <div class="hero-foot">
                <div class="pill-row">
                  <div class="pill"><small>Equipamiento</small> <span>${equipment.length}</span></div>
                  <div class="pill"><small>Trade Items</small> <span>${trade.length}</span></div>
                  <div class="pill"><small>Spirit</small> <span>${spirit.length}</span></div>
                  <div class="pill"><small>Magic</small> <span>${magic.length}</span></div>
                  <div class="pill"><small>Skills</small> <span>${skills.length}</span></div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="section-wrap reveal">
          <div class="tabs-shell">
            <div class="tabs-header" role="tablist" aria-label="Secciones del NFT">
              ${sections.map((section, index) => {
                const meta = getTabMeta(section.id);
                return `
                  <button
                    class="tab-btn ${index === 0 ? "active" : ""}"
                    role="tab"
                    aria-selected="${index === 0 ? "true" : "false"}"
                    data-tab="panel-${section.id}">
                    ${section.icon} ${meta.title}
                  </button>
                `;
              }).join("")}
            </div>

            ${sections.map((section, index) => {
              const meta = getTabMeta(section.id);
              return `
                <section class="panel ${index === 0 ? "active" : ""}" id="panel-${section.id}" role="tabpanel">
                  <div class="panel-intro">
                    <div>
                      <h2 class="panel-title">${meta.title}</h2>
                      <p class="panel-desc">${meta.desc}</p>
                    </div>
                    <div class="panel-count">${section.items.length} elementos</div>
                  </div>
                  ${renderItemsGrid(section.items, meta.empty)}
                </section>
              `;
            }).join("")}
          </div>
        </section>
      `;

      mountTabEvents();
      setupReveal();
    }

    async function cargarDetalle() {
      if (!nftId) {
        renderError("No se especificó un ID de personaje válido en la URL.", "ID no encontrado");
        return;
      }

      try {
        const res = await fetch(URL_API, { headers: { "Accept": "application/json" } });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        const items = Array.isArray(data?.items) ? data.items : Array.isArray(data) ? data : [];

        const nft = items.find(item => {
          const itemId = String(item?.id ?? "");
          const itemUrl = String(item?.url ?? "");
          return itemId === String(nftId) || itemUrl.includes(String(nftId));
        });

        if (!nft) {
          renderError(`No se encontró el personaje con ID #${nftId}.`, "NFT no encontrado");
          return;
        }

        buildDetail(nft);
      } catch (error) {
        console.error(error);
        renderError("No fue posible conectar con el servidor para cargar el detalle del NFT.", "Fallo de conexión");
      }
    }

    document.addEventListener("DOMContentLoaded", cargarDetalle);
  </script>
</body>
</html>
