<script>
  const params = new URLSearchParams(window.location.search);
  const nftId = params.get('id');
  const URL_API = "https://mir4-backend.onrender.com/api/nfts";

  function escapeHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatNumber(value, fallback = '—') {
    const num = Number(value);
    return Number.isFinite(num) ? num.toLocaleString() : fallback;
  }

  function getRarityClass(rarity) {
    const r = String(rarity || '').toLowerCase();
    if (r.includes('legend')) return 'legendary';
    if (r.includes('epic')) return 'epic';
    if (r.includes('rare')) return 'rare';
    return '';
  }

  function switchTab(event, tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.section-content').forEach(sec => sec.classList.remove('active'));
    if (event && event.currentTarget) event.currentTarget.classList.add('active');
    const tab = document.getElementById(tabId);
    if (tab) tab.classList.add('active');
  }

  function renderItemsGrid(items, emptyText = 'No hay elementos disponibles.') {
    if (!Array.isArray(items) || items.length === 0) {
      return `<div class="loading">${escapeHtml(emptyText)}</div>`;
    }

    return `
      <div class="gear-grid">
        ${items.map(item => {
          const name = escapeHtml(item.name || item.title || 'Sin nombre');
          const rarityClass = getRarityClass(item.rarity || item.grade || item.rank);
          const rarityText = escapeHtml(item.rarity || item.grade || item.rank || 'Item');
          const img = escapeHtml(item.image || 'https://www.xdraco.com/nft/assets/img/common/thumb-default.png');
          const enhance = escapeHtml(item.enhance ?? item.refine ?? item.level ?? '');
          const tradeable = item.tradeable || item.is_tradeable || item.trade ? `<div class="trade-t" title="Tradeable">T</div>` : '';
          const extra = item.amount !== undefined ? escapeHtml(formatNumber(item.amount)) : '';

          return `
            <div class="gear-slot ${rarityClass}">
              ${tradeable}
              <span class="slot-badge-top">${rarityText}</span>
              <img src="${img}" alt="${name}"
                   onerror="this.onerror=null;this.src='https://www.xdraco.com/nft/assets/img/common/thumb-default.png'">
              <div class="gear-name">${name}</div>
              <div class="gear-enhance">${enhance ? `+${enhance}` : extra}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  async function cargarInterfazHof() {
    const app = document.getElementById('app');
    if (!app) return;

    if (!nftId) {
      app.innerHTML = `<div class="loading" style="color:#ef4444;">No se especificó un ID de personaje.</div>`;
      return;
    }

    try {
      const res = await fetch(URL_API);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const data = await res.json();
      const items = Array.isArray(data.items) ? data.items : [];

      const nft = items.find(item => {
        const itemId = String(item?.id ?? '');
        const itemUrl = String(item?.url ?? '');
        return itemId === String(nftId) || itemUrl.includes(String(nftId));
      });

      if (!nft) {
        app.innerHTML = `<div class="loading" style="color:#ef4444;">No se encontró el personaje ID #${escapeHtml(nftId)}</div>`;
        return;
      }

      const name = escapeHtml(nft.name || 'Sin nombre');
      const klass = escapeHtml(nft.class || 'ASIA');
      const server = escapeHtml(nft.server || 'N/A');
      const image = escapeHtml(nft.image || 'https://www.xdraco.com/nft/assets/img/common/thumb-default.png');
      const level = formatNumber(nft.level, '—');
      const power = formatNumber(nft.power, '—');
      const wemix = formatNumber(nft.price_wemix ?? nft.price, '0');
      const priceUsd = Number(nft.price_usd);
      const usdText = Number.isFinite(priceUsd) ? `~$${priceUsd.toLocaleString()} USD` : '';
      const rarityClass = getRarityClass(nft.rarity || nft.rank || nft.grade);

      const equipmentHtml = renderItemsGrid(
        nft.equipment || nft.equipped_gear || nft.gear || [],
        'No hay equipamiento disponible.'
      );

      const tradeHtml = renderItemsGrid(
        nft.trade_items || nft.tradeables || nft.inventory_trade || [],
        'No hay ítems tradeables disponibles.'
      );

      const spiritHtml = renderItemsGrid(
        nft.spirits || nft.spirit || nft.summons || [],
        'No hay espíritus disponibles.'
      );

      const magicHtml = renderItemsGrid(
        nft.magic_stones || nft.magic || nft.orbs || [],
        'No hay piedras mágicas disponibles.'
      );

      const skillsHtml = renderItemsGrid(
        nft.skills || nft.abilities || [],
        'No hay habilidades disponibles.'
      );

      app.innerHTML = `
        <div class="top-nav-back">
          <a href="index.html" class="back-link">← Back to List</a>
        </div>

        <div class="header-card">
          <div class="char-main-info">
            <div class="char-avatar ${rarityClass}">
              <img src="${image}" alt="${name}"
                   onerror="this.onerror=null;this.src='https://www.xdraco.com/nft/assets/img/common/thumb-default.png'">
            </div>
            <div class="char-details">
              <h1>${name}</h1>
              <div class="char-sub">
                <span class="lvl">Level ${level}</span>
                <span>Power: <strong>${power}</strong></span>
                <span>Server: <strong>${server}</strong></span>
              </div>
            </div>
          </div>
          <div class="char-price-box">
            <div class="price-val">💎 ${wemix} WEMIX</div>
            <div class="price-usd">${usdText}</div>
          </div>
        </div>

        <div class="tabs-bar">
          <button class="tab-btn active" onclick="switchTab(event, 'tab-equipment')">Equipment</button>
          <button class="tab-btn" onclick="switchTab(event, 'tab-trade')">Trade Items 📦</button>
          <button class="tab-btn" onclick="switchTab(event, 'tab-spirit')">Spirit</button>
          <button class="tab-btn" onclick="switchTab(event, 'tab-magic')">Magic Stone</button>
          <button class="tab-btn" onclick="switchTab(event, 'tab-skills')">Skills</button>
        </div>

        <div id="tab-equipment" class="section-content active">
          <div class="inventory-panel">
            <div class="panel-title">Equipped Gear (Equipamiento Activo)</div>
            ${equipmentHtml}
          </div>
        </div>

        <div id="tab-trade" class="section-content">
          <div class="inventory-panel">
            <div class="panel-title">Ítems Tradeables en Cartera / Almacén (Con Sello T)</div>
            ${tradeHtml}
          </div>
        </div>

        <div id="tab-spirit" class="section-content">
          <div class="inventory-panel">
            <div class="panel-title">Espíritus Equipados</div>
            ${spiritHtml}
          </div>
        </div>

        <div id="tab-magic" class="section-content">
          <div class="inventory-panel">
            <div class="panel-title">Piedras Mágicas y Orbes</div>
            ${magicHtml}
          </div>
        </div>

        <div id="tab-skills" class="section-content">
          <div class="inventory-panel">
            <div class="panel-title">Nivel de Habilidades (Skills)</div>
            ${skillsHtml}
          </div>
        </div>
      `;
    } catch (err) {
      console.error(err);
      app.innerHTML = `<div class="loading" style="color:#ef4444;">Error al conectar con el servidor para cargar el detalle.</div>`;
    }
  }

  document.addEventListener('DOMContentLoaded', cargarInterfazHof);
</script>
