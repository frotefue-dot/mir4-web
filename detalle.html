<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario e Ítems Trade - MIR4 Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #07090e;
    --bg-card: #121620;
    --border-color: #212838;
    --accent-blue: #3b82f6;
    --accent-gold: #f59e0b;
    --accent-cyan: #38bdf8;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background-color: var(--bg-main); 
    color: var(--text-main); 
    font-family: 'Outfit', sans-serif; 
    padding: 20px;
  }

  nav {
    max-width: 1000px;
    margin: 0 auto 30px auto;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    padding: 15px 25px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .back-btn {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-main);
    padding: 8px 16px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--border-color);
    transition: all 0.2s;
  }

  .back-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent-blue); }

  .main-container {
    max-width: 1000px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 25px;
  }

  @media (max-width: 768px) {
    .main-container { grid-template-columns: 1fr; }
  }

  .card-info {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .card-info h2 { font-size: 20px; color: #fff; }
  .stat-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
  .stat-row span { color: #fff; font-weight: 600; }

  .trade-section {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 25px;
  }

  .trade-section h3 {
    font-size: 18px;
    color: var(--accent-cyan);
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 12px;
  }

  .item-slot {
    background: #090d14;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: border-color 0.2s;
  }

  .item-slot:hover { border-color: var(--accent-gold); }

  .item-slot img {
    width: 48px;
    height: 48px;
    object-fit: contain;
  }

  .item-name {
    font-size: 11px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }

  .item-qty {
    font-size: 10px;
    color: var(--accent-gold);
    font-weight: 700;
  }

  .loading { text-align: center; color: var(--text-muted); padding: 40px; grid-column: span 2; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="back-btn">← Volver al Marketplace</a>
  <span style="font-size: 14px; color: var(--accent-gold);">📦 Inspección de Inventario Trade</span>
</nav>

<div class="main-container" id="content-area">
  <div class="loading">Cargando datos oficiales del NFT y sus ítems tradeables...</div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const nftId = params.get('id');

  // URL de tu backend en Render
  const URL_API = "https://mir4-backend.onrender.com/api/nfts";

  async function cargarDetallesNft() {
    try {
      const res = await fetch(URL_API);
      const data = await res.json();
      
      // Buscar el NFT específico por su ID
      const nft = data.items.find(item => item.id == nftId || item.url.includes(nftId));
      const contenedor = document.getElementById('content-area');

      if (!nft) {
        contenedor.innerHTML = `<div class="loading" style="color: #ef4444;">No se encontró información para el personaje #${nftId}</div>`;
        return;
      }

      // Renderizamos la estructura directamente en tu web con los datos oficiales obtenidos
      contenedor.innerHTML = `
        <div class="card-info">
          <h2>${nft.name}</h2>
          <div class="stat-row">Clase: <span>${nft.class}</span></div>
          <div class="stat-row">Nivel: <span>${nft.level}</span></div>
          <div class="stat-row">Poder (PS): <span>${nft.power}</span></div>
          <div class="stat-row">Precio: <span style="color: var(--accent-cyan);">${nft.price}</span></div>
          <a href="${nft.url}" target="_blank" style="margin-top: 15px; text-align: center; background: var(--accent-blue); color: white; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px;">Ver Registro Oficial XDRACO</a>
        </div>

        <div class="trade-section">
          <h3>📦 Ítems Tradeables en Inventario / Almacén</h3>
          <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">
            Objetos sellados, materiales valiosos y recursos transferibles incluidos en la cartera de este NFT.
          </p>
          <div class="items-grid" id="trade-items-grid">
            <!-- Simulación dinámica de elementos trade oficiales detectados en la wallet del personaje -->
            <div class="item-slot">
              <img src="https://www.xdraco.com/nft/assets/img/common/thumb-default.png" alt="Acero Oscuro">
              <div class="item-name">Darksteel Sellado</div>
              <div class="item-qty">100,000</div>
            </div>
            <div class="item-slot">
              <img src="https://www.xdraco.com/nft/assets/img/common/thumb-default.png" alt="Piedra Mágica">
              <div class="item-slot-name item-name">Piedra Mágica</div>
              <div class="item-qty">Rare +2</div>
            </div>
            <div class="item-slot">
              <img src="https://www.xdraco.com/nft/assets/img/common/thumb-default.png" alt="Hierro">
              <div class="item-name">Drafted Energy</div>
              <div class="item-qty">50 pcs</div>
            </div>
          </div>
        </div>
      `;
    } catch (err) {
      console.error(err);
      document.getElementById('content-area').innerHTML = `<div class="loading" style="color: #ef4444;">Error al conectar con el servidor backend.</div>`;
    }
  }

  cargarDetallesNft();
</script>

</body>
</html>
